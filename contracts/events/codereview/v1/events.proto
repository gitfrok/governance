syntax = "proto3";

// Code Review domain events (SPEC-0019, SPEC-0028). Events carry opaque IDs
// and tenant/repository scope; they never carry review text, credentials,
// Git objects, or a policy allow flag. Repository/Git consumes only
// BranchProtectionChanged, into a tenant-scoped local projection;
// Security/Findings consumes MergeRequestOpened and MergeRequestUpdated
// into its own projection to learn an MR's head and target without calling
// Code Review on a read path (SPEC-0028).
package gitsaas.events.codereview.v1;

option go_package = "github.com/yourorg/gitsaas/gen/events/codereview/v1;coderevieweventsv1";

import "google/protobuf/timestamp.proto";

enum ReviewSubmittedDisposition {
  REVIEW_SUBMITTED_DISPOSITION_UNSPECIFIED = 0;
  REVIEW_SUBMITTED_DISPOSITION_APPROVE = 1;
  REVIEW_SUBMITTED_DISPOSITION_REQUEST_CHANGES = 2;
  REVIEW_SUBMITTED_DISPOSITION_COMMENT = 3;
}

message MergeRequestOpened {
  string event_id = 1;
  string merge_request_id = 2;
  string tenant_id = 3;
  string repository_id = 4;
  string source_ref = 5;
  string target_ref = 6;
  string creator_id = 7;
  google.protobuf.Timestamp occurred_at = 8;
}

message ReviewSubmitted {
  string event_id = 1;
  string merge_request_id = 2;
  string tenant_id = 3;
  string repository_id = 4;
  string actor_id = 5;
  ReviewSubmittedDisposition disposition = 6;
  string head_revision = 7;
  google.protobuf.Timestamp occurred_at = 8;
}

message MergeRequestMerged {
  string event_id = 1;
  string merge_request_id = 2;
  string tenant_id = 3;
  string repository_id = 4;
  string actor_id = 5;
  string target_ref = 6;
  string head_revision = 7;
  google.protobuf.Timestamp occurred_at = 8;
}

// MergeRequestUpdated records that an open merge request moved: a push to
// its source ref (new head revision) or a retarget to a different target
// ref (SPEC-0028). Neither movement is observable from the existing events —
// MergeRequestOpened carries no head revision and fires once,
// ReviewSubmitted names a head only when a review lands, and the
// repository's RefUpdated carries no merge-request association — and a
// retarget changes no ref at all. Additive for SPEC-0028, whose consumers
// (Security/Findings) must recompute introduction attribution whenever the
// head or the merge base moves: the event names both sides of what can
// move, so a projection needs no second read to learn the new pair.
message MergeRequestUpdated {
  string event_id = 1;
  string merge_request_id = 2;
  string tenant_id = 3;
  string repository_id = 4;
  // The verified actor whose push or retarget moved the merge request.
  string actor_id = 5;
  // The MR's head revision after the move. Always the current head; a
  // retarget-only move repeats the head it already had.
  string head_revision = 6;
  string source_ref = 7;
  // The target ref after the move; unchanged for a head-only push.
  string target_ref = 8;
  google.protobuf.Timestamp occurred_at = 9;
}

message BranchProtectionChanged {
  string event_id = 1;
  string tenant_id = 2;
  string repository_id = 3;
  string target_ref = 4;
  int32 required_approvals = 5;
  google.protobuf.Timestamp occurred_at = 6;
  // The actor whose authorized SetProtection produced this change. Added so a
  // cross-process consumer can re-derive the verified subject when it applies
  // its own PDP decision for the rule (GitStorage.SetProtection).
  string actor_id = 7;
  // The roles the actor held when SetProtection was decided, delivered so a
  // cross-process consumer can re-run its own PDP decision with the same
  // subject the authorizing PEP saw (same shape as RefUpdated.actor_roles in
  // events/ci). Never a policy outcome: the consumer still decides for itself.
  repeated string actor_roles = 8;
}
