syntax = "proto3";

// The audit trail (ADR-0007, SPEC-0003).
//
// One generic AuditEvent rather than a message per action, because SPEC-0003 asks for "an AuditEvent
// shape" and because the alternative scales badly: every new sensitive action would be a contracts
// change, and an evidence export (PR-17/PR-18) would have to know every message type that ever
// existed. A typed `action` keeps the surface stable while the vocabulary grows.
//
// WHAT IS NOT HERE, deliberately: no sequence number and no hashes. Entries are hash-chained by the
// audit store (ADR-0007), and the chain is a property of the log, not of the message — an emitter
// cannot know its position in a chain it has not been appended to yet, and a producer that could
// state its own hash could also lie about it.
//
// No payloads either. An audit record of an attempted leak must not itself become the vehicle that
// copies one tenant's data somewhere less protected (G1). Fields carry identifiers and outcomes,
// never row contents, request bodies, or credentials.

package gitsaas.events.audit.v1;

option go_package = "github.com/yourorg/gitsaas/gen/events/audit/v1;auditeventsv1";

import "google/protobuf/timestamp.proto";

// AuditEvent records one sensitive action for compliance and investigation.
//
// Emitted by whichever context performed (or refused) the action; consumed by the Audit context,
// which is the only writer of the trail.
message AuditEvent {
  string event_id  = 1;   // ULID; idempotency key, so a redelivery does not append twice
  string tenant_id = 2;   // owning tenant; every event is tenant-scoped (invariant 1)

  // What happened, as a stable dotted vocabulary — e.g. "tenant.isolation.violation".
  // A string rather than an enum: an enum would make every new auditable action a breaking-adjacent
  // contracts change and a coordinated deploy, and ADR-0034's gate would (correctly) reject
  // renaming one later. New actions are additive by construction this way.
  string action = 3;

  // Who acted. Empty when the actor is the platform itself rather than a principal.
  string actor_id = 4;

  // What was acted on, as an opaque identifier — "repo/01H…", "tenant/acme". Not a URL, and never
  // the resource's contents.
  string resource = 5;

  Outcome outcome = 6;

  // Machine-readable context: SQL states, policy names, decision IDs. Small, non-sensitive, and
  // never row data — see the file comment. A map so a new detail is not a schema change.
  map<string, string> detail = 7;

  google.protobuf.Timestamp occurred_at = 8;

  // Policy decision provenance (SPEC-0029 AC8, SPEC-0030). Set when the audited
  // action was gated by a PDP decision; empty otherwise. All four are
  // server-produced by the Policy context from the decision it recorded — none
  // is a caller claim, and a DRY_RUN decision is labelled by policy_mode and is
  // never written as an enforced control record (SPEC-0029 AC2).
  //
  // decision_id correlates the audit record with the decision the PDP assigned
  // (policy.v1.DecideResponse.decision_id). bundle_revision is the deciding
  // policy version (DecideResponse.policy_revision). input_digest is the digest
  // over the canonicalized input the decision was made over. policy_mode is the
  // string rendering of policy.v1.EvaluationMode — "ENFORCED" or "DRY_RUN". A
  // string rather than an import of the policy enum, for the same reason
  // `action` is a string: the audit event keeps no dependency on the policy wire
  // shape, and a new mode is additive by construction.
  string decision_id = 9;
  string bundle_revision = 10;
  string input_digest = 11;
  string policy_mode = 12;
}

// Outcome distinguishes a completed action from a refused one. Refusals are the more interesting
// half: a rejected cross-tenant write is exactly the signal an investigation looks for.
enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_ALLOWED     = 1;  // the action was performed
  OUTCOME_DENIED      = 2;  // refused by policy, RLS, or another guard
}

// HistoryImported is the one first-party audit event an import produces
// (ADR-0029 §3, SPEC-0011 AC10).
//
// It records the auditable fact — "this authenticated operator imported this
// attested set from there at this time" — and the manifest digest over the
// imported payload set, so the set is reproducible after the fact without
// claiming it is true. It is chained normally and is the ONLY record of the
// import in the audit trail: the imported content itself is ATTESTED_IMPORT
// and never enters the log.
message HistoryImported {
  string event_id = 1;
  string tenant_id = 2;
  // The operator who ran the import, authenticated and PDP-authorized.
  string actor_id = 3;
  string repository_id = 4;
  string import_id = 5;
  // e.g. "github", "github.com".
  string source_system = 6;
  string source_instance = 7;
  // Record counts per type: MRs, threads, comments, approvals.
  map<string, int64> record_counts = 8;
  // Digest over the imported payload set; mutating any imported record
  // afterwards makes verification fail (SPEC-0011 AC16).
  string manifest_digest = 9;
  google.protobuf.Timestamp occurred_at = 10;
}

// HistoryImportRevoked records the revocation of a prior import (ADR-0029 §5,
// SPEC-0011 AC17). It references the original import_id; the original
// HistoryImported chain entry stays unaltered (invariant 5). Revocation is a
// forward-only act — the records are tombstoned, never edited or deleted.
message HistoryImportRevoked {
  string event_id = 1;
  string tenant_id = 2;
  // The operator who revoked the import, authenticated and PDP-authorized.
  string actor_id = 3;
  string repository_id = 4;
  string import_id = 5;
  google.protobuf.Timestamp occurred_at = 6;
}

// DeclaredActorMapped records a tenant admin asserting that a foreign handle
// from an import belongs to a platform identity (SPEC-0011 AC10, ADR-0029 §4).
//
// It is FIRST_PARTY, and it must be: the assertion is ours, made by an
// authenticated admin our PDP authorized, timestamped by our clock. The imported
// record it refers to stays ATTESTED_IMPORT and stays out of the log.
//
// The event names the asserting admin because that is the whole accountability
// story. An identity mapping is how imported history could be made to look like
// platform history, so who claimed it has to be recoverable years later — email
// equality, a heuristic, or a bulk guess must never be able to produce one of
// these without a name attached.
message DeclaredActorMapped {
  string event_id = 1;
  string tenant_id = 2;
  // The tenant admin who asserted the mapping, authenticated and PDP-authorized.
  string actor_id = 3;
  string import_id = 4;
  // The foreign handle and the instance it came from. A handle is only meaningful
  // within its instance.
  string declared_actor = 5;
  string source_instance = 6;
  // The platform identity the admin asserted the handle belongs to.
  string mapped_actor_id = 7;
  google.protobuf.Timestamp occurred_at = 8;
}

// EvidencePackRequested records that a compliance owner requested a
// date-ranged evidence pack (SPEC-0031, SPEC-0032, T-0026).
//
// Like every audit event it carries opaque identifiers, tenant scope and
// counts — never record contents, source, or provenance bytes (SPEC-0032 G9):
// a pack's control records travel in the pack, not in the event that
// announces it. The generation decision is a PDP decision
// (evidence.pack.generate) and this record correlates to it via decision_id
// (SPEC-0032 AC6). Replaying a request ID produces no second pack and no
// second event (SPEC-0032 AC1).
message EvidencePackRequested {
  string event_id = 1;
  string tenant_id = 2;
  // The compliance owner who requested the pack, authenticated and
  // PDP-authorized (SPEC-0031 AC5: no engineer involvement).
  string actor_id = 3;
  // The opaque, server-assigned pack identity.
  string pack_id = 4;
  // The request ID the pack is idempotent under.
  string request_id = 5;
  // The PDP decision that authorized generation.
  string decision_id = 6;
  // The closed range the pack covers.
  google.protobuf.Timestamp range_from = 7;
  google.protobuf.Timestamp range_to = 8;
  // The optional repository scope; empty covers the tenant's repositories.
  string repository_id = 9;
  google.protobuf.Timestamp occurred_at = 10;
}

// EvidencePackCompleted records that a requested pack finished assembling —
// ready, or failed (SPEC-0031 non-functional: generation is asynchronous and
// observable). It carries section counts, never record contents, source, or
// provenance bytes (SPEC-0032 G9).
message EvidencePackCompleted {
  string event_id = 1;
  string tenant_id = 2;
  // The actor whose request produced the pack.
  string actor_id = 3;
  string pack_id = 4;
  // READY or FAILED, as the string rendering of audit.v1.PackState. A string
  // rather than an import of the RPC enum, for the same reason `action` is a
  // string: the event keeps no dependency on the audit RPC wire shape, and a
  // new state is additive by construction.
  string state = 5;
  // Control records assembled per section, keyed by the section name:
  // "approvals", "policy_decisions", "scan_gates", "access_changes".
  map<string, int64> section_counts = 6;
  // Attested records assembled into the labelled appendix. A statistic only:
  // attested content itself travels in the pack, never in this event.
  int64 appendix_record_count = 7;
  // The closed range the pack covers.
  google.protobuf.Timestamp range_from = 8;
  google.protobuf.Timestamp range_to = 9;
  google.protobuf.Timestamp occurred_at = 10;
}
