syntax = "proto3";

// Identity & Access's auditor grant surface (SPEC-0033, T-0027, PRD PR-18).
//
// An external auditor must be able to read evidence and nothing else. A grant
// is a DISTINCT principal shape, not a role that happens to read less: it is
// scoped to a tenant, a closed date range and the named packs within it, is
// read-only, is time-boxed, and confers NO repository read (SPEC-0033). An
// auditor who could enumerate repositories has already learned something the
// grant did not authorize.
//
// What this surface encodes, and what it structurally excludes:
//
// - The grant carries scope and expiry only. It has no repository permission,
//   no role list that could imply one, and no field a caller could read as an
//   authorization outcome. Enforcement is a PDP decision (evidence.pack.read
//   gated by decision-time grant facts; auditor.grant.manage for this
//   surface), never a role toggle, a BFF check, or a token scope claim
//   (SPEC-0033 AC5).
// - Expiry is a server-recognized instant, not a timer contract: the server
//   reads the grant's state and expiry from Identity & Access at decision
//   time and supplies them as decision-context facts. A request can therefore
//   never carry grant state, an extension, or a renewal — there are no fields
//   to carry them in (SPEC-0033 AC8). Using a grant never moves its expiry;
//   widening one is a new CreateAuditorGrant decision.
// - Revocation is immediate by construction (SPEC-0033 AC7): the PEP supplies
//   grant state and expiry fresh on every decision request, so a revoked or
//   expired grant changes the decision's input and fails the very next
//   decision — there is no cached decision or token to outlive it.
//
// Every failure — a nonexistent, revoked, expired, cross-tenant, malformed or
// unauthorized grant — is the same coarse denial (SPEC-0001): an auditor must
// not be able to distinguish "does not exist" from "not yours", or probing
// this surface enumerates grants and tenants.
package gitsaas.identity.v1;

option go_package = "github.com/yourorg/gitsaas/gen/proto/identity/v1;identityv1";

import "google/protobuf/timestamp.proto";

service AuditorGrantService {
  // CreateAuditorGrant issues a scoped, read-only, time-boxed grant. The
  // caller supplies the auditor principal, the evidence scope (a closed date
  // range, an optional repository scope, the named packs) and a requested
  // expiry; the server assigns the grant's identity and version and may bound
  // the expiry — the issued expires_at is the fact that counts. Issuing is a
  // PDP decision (auditor.grant.manage, owner-only) and appends the immutable
  // audit record naming the granting admin and the auditor principal
  // (SPEC-0033 AC4). Idempotent per tenant and request ID: replaying a
  // request ID returns the same grant and appends nothing new.
  rpc CreateAuditorGrant(CreateAuditorGrantRequest) returns (CreateAuditorGrantResponse);
  // RevokeAuditorGrant terminates a grant. Revocation takes effect on the
  // next decision, not the next cache cycle: grant state is read at decision
  // time and arrives as a decision-context fact (SPEC-0033 AC7). Revoking is
  // a PDP decision (auditor.grant.manage) and is audited. Not-found,
  // cross-tenant, already-revoked, expired and unauthorized are the same
  // coarse denial (SPEC-0001).
  rpc RevokeAuditorGrant(RevokeAuditorGrantRequest) returns (RevokeAuditorGrantResponse);
  // ListAuditorGrants pages the tenant's grants for administration. It lists
  // scope, state and lifecycle only — never pack contents — and is a PDP
  // decision (auditor.grant.manage). A cross-tenant or unauthorized list is
  // the same coarse denial as an empty one (SPEC-0001).
  rpc ListAuditorGrants(ListAuditorGrantsRequest) returns (ListAuditorGrantsResponse);
}

// AuditorGrantContext is derived from an authenticated principal by the PEP.
// The actor ID and roles are verified server-side; a caller cannot assert
// them. A grant is always tenant-scoped and can never span two tenants, so
// the context carries no pack or repository handle: scope is per-request,
// never part of the verified identity. An empty or cross-tenant context is a
// coarse denial that does not distinguish nonexistent from unauthorized
// (SPEC-0001).
message AuditorGrantContext {
  string tenant_id = 1;
  string actor_id = 2;
  repeated string actor_roles = 3;
  string request_id = 4;
}

// AuditorGrantState is the lifecycle of a grant. It is a server fact read
// from Identity & Access at decision time — never a caller claim, and never
// carried by a request, a cookie, or an event as an authorization assertion
// (SPEC-0033). UNSPECIFIED names the absence of a state; it is never a state
// a grant holds, and a decision presented with it fails closed.
enum AuditorGrantState {
  AUDITOR_GRANT_STATE_UNSPECIFIED = 0;
  // Issued and not yet expired or revoked; readable under its scope.
  AUDITOR_GRANT_STATE_ACTIVE = 1;
  // Terminated by an authorized admin before expiry. Immediate: the next
  // decision fails (SPEC-0033 AC7).
  AUDITOR_GRANT_STATE_REVOKED = 2;
  // Past its expiry. Expiry happens without an operator action (SPEC-0033
  // AC3); the state is the server's rendering of its own clock.
  AUDITOR_GRANT_STATE_EXPIRED = 3;
}

// AuditorGrant is one scoped, read-only, time-boxed grant record. Identity,
// state and versions are server-assigned; a caller supplies scope and
// requested expiry only. It carries no repository permission, no role that
// implies one, and no renewal-on-use — using a grant never mutates it
// (SPEC-0033 AC8).
message AuditorGrant {
  // The opaque, server-assigned grant identity.
  string grant_id = 1;
  // The tenant the grant is scoped to. A grant can never span two tenants.
  string tenant_id = 2;
  // The auditor principal the grant authorizes.
  string auditor_principal_id = 3;
  // The evidence scope: the closed date range the granted packs must cover.
  google.protobuf.Timestamp range_from = 4;
  google.protobuf.Timestamp range_to = 5;
  // The optional repository scope; empty covers the tenant's repositories.
  // This NARROWS which packs the grant can name — it is not a repository
  // permission, and confers no repository read (SPEC-0033 AC1).
  string repository_id = 6;
  // The named packs the grant authorizes reading, as opaque pack identities.
  // A pack not named here is out of scope, whatever its range.
  repeated string pack_ids = 7;
  // The instant the grant stops authorizing reads, on the server's clock.
  // The server recognizes it at decision time; no timer contract runs for it
  // and no operator action is required for it to take effect (SPEC-0033 AC3).
  google.protobuf.Timestamp expires_at = 8;
  // The admin whose auditor.grant.manage decision issued the grant. Named on
  // the record because grant lifecycle is itself accountability evidence
  // (SPEC-0033 AC4).
  string granted_by = 9;
  google.protobuf.Timestamp issued_at = 10;
  // Set when state is REVOKED; empty otherwise.
  google.protobuf.Timestamp revoked_at = 11;
  // The server-derived lifecycle. A response rendering of Identity & Access's
  // own record — never an input to any decision, which reads this fact fresh
  // at decision time instead (SPEC-0033 AC7).
  AuditorGrantState state = 12;
}

// CreateAuditorGrantRequest carries the scope an admin requests and nothing
// else. It deliberately has no field for grant identity, state, versions, a
// decision outcome, or an extension/renewal of an existing grant: widening a
// grant is a new decision, and state is a fact only the server can hold
// (SPEC-0033 AC8).
message CreateAuditorGrantRequest {
  AuditorGrantContext context = 1;
  // The auditor principal the grant will authorize.
  string auditor_principal_id = 2;
  // Inclusive bounds of the evidence range. Required; from after to is
  // rejected — the range is closed, never half-open.
  google.protobuf.Timestamp range_from = 3;
  google.protobuf.Timestamp range_to = 4;
  // Optional repository scope narrowing which packs the grant may name.
  string repository_id = 5;
  // The packs the grant names. Required and non-empty: a grant with no named
  // packs authorizes nothing and is rejected at issue time.
  repeated string pack_ids = 6;
  // The requested expiry. The server may bound it; the issued grant's
  // expires_at is the fact decisions read. A missing expiry is rejected — a
  // grant is time-boxed by construction (SPEC-0033 AC3).
  google.protobuf.Timestamp expires_at = 7;
}

message CreateAuditorGrantResponse {
  // The grant as issued: server-assigned identity, versions and state, and
  // the expiry the server recognized (which may bound the requested one).
  AuditorGrant grant = 1;
}

// RevokeAuditorGrantRequest names the grant to terminate. The grant_id is a
// SELECTOR, not a claim: the caller can only name a grant the server already
// issued in this tenant, and the revocation writes the server-derived state
// transition. No request field carries grant state (SPEC-0033 AC7/AC8).
message RevokeAuditorGrantRequest {
  AuditorGrantContext context = 1;
  string grant_id = 2;
}

message RevokeAuditorGrantResponse {
  // The grant as revoked: state REVOKED and the revocation instant.
  AuditorGrant grant = 1;
}

// ListAuditorGrantsRequest pages the tenant's grants. The optional filter
// narrows to one auditor principal; empty lists every grant the tenant has.
message ListAuditorGrantsRequest {
  AuditorGrantContext context = 1;
  string auditor_principal_id = 2;
}

message ListAuditorGrantsResponse {
  // Scope, state and lifecycle only — never pack contents.
  repeated AuditorGrant grants = 1;
}
