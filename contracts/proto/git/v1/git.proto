syntax = "proto3";

// Internal Git storage transport (ADR-0004, SPEC-0015).
//
// This is never a browser-facing or untrusted-client API. Smart-HTTP and SSH front doors
// authenticate callers and translate the Git protocol into these streams (T-0011); git-storaged
// independently resolves the tenant-scoped handle and asks the PDP before it starts Git.
package gitsaas.git.v1;

option go_package = "github.com/yourorg/gitsaas/gen/proto/git/v1;gitv1";

service GitStorage {
  // UploadPack carries an unmodified git-upload-pack exchange for clone and fetch.
  rpc UploadPack(stream UploadPackRequest) returns (stream UploadPackResponse);

  // ReceivePack carries an unmodified git-receive-pack exchange for push.
  rpc ReceivePack(stream ReceivePackRequest) returns (stream ReceivePackResponse);

  // MergeRef moves one exact branch ref to an existing revision on behalf of an
  // authorized merge (SPEC-0019). It is the only route by which a ref changes
  // without a Git protocol exchange, and it exists so Code Review can complete a
  // merge through a contract boundary instead of against Git storage.
  //
  // It is not a general ref-write API: it moves one ref, it names no source
  // repository or path, it carries no pack bytes, and it cannot create or delete
  // a repository. git-storaged asks the PDP itself before applying it, exactly as
  // it does for a push — a caller that has already been allowed by its own PEP is
  // still not trusted to assert that here.
  rpc MergeRef(MergeRefRequest) returns (MergeRefResponse);

  // ImportRefs fetches a source repository's refs and tags into this repository
  // on behalf of an authorized import (SPEC-0011, T-0018).
  //
  // It is the import path's git phase: the caller has already been PDP-authorized
  // by Code Review's ImportService; storage asks the PDP again with its own
  // server-derived context, then runs `git fetch` from the source URL and
  // publishes RefUpdated for every ref that moved. The fetch is acknowledged
  // through the same durability path as a push — the primary and one in-sync
  // replica must both hold the objects before the refs are announced (ADR-0016).
  //
  // The source URL and token are request-only secrets. They are never stored,
  // never logged, and never copied into an event, audit record, or error.
  rpc ImportRefs(ImportRefsRequest) returns (ImportRefsResponse);
}

// OperationContext identifies one Git operation. It is sent as the first client-stream message;
// later messages contain only protocol bytes or close. No path, credential, or authorization result
// crosses this boundary: those would let a caller choose storage or bypass the PDP. Roles are a
// verified principal attribute for the storage PDP input, never an `allowed` assertion.
message OperationContext {
  string tenant_id = 1;
  string repository_id = 2;
  string actor_id = 3;
  string request_id = 4;
  repeated string actor_roles = 5;
  // Declares the already-authenticated client protocol framing. It is selected
  // by a trusted front door, never by an external Git payload; unspecified is
  // denied so storage cannot accidentally choose the wrong Git subprocess mode.
  GitTransport transport = 6;
}

// GitTransport distinguishes SSH's stateful exchange from Smart-HTTP's
// stateless discovery and RPC framing. All modes retain the same verified
// principal, opaque repository handle, and GitStorage PDP enforcement.
enum GitTransport {
  GIT_TRANSPORT_UNSPECIFIED = 0;
  GIT_TRANSPORT_SSH = 1;
  GIT_TRANSPORT_SMART_HTTP_DISCOVERY = 2;
  GIT_TRANSPORT_SMART_HTTP_RPC = 3;
}

message UploadPackRequest {
  oneof payload {
    OperationContext context = 1;
    bytes data = 2;
    bool close = 3;
  }
}

message UploadPackResponse {
  bytes data = 1;
}

message ReceivePackRequest {
  oneof payload {
    OperationContext context = 1;
    bytes data = 2;
    bool close = 3;
  }
}

message ReceivePackResponse {
  bytes data = 1;
}

// RefUpdateContext identifies one authorized ref move. It is the OperationContext
// fields that still mean something without a Git protocol exchange: there is no
// transport, because no client framing is involved. Like OperationContext it
// carries no path, credential, or authorization result, and its roles are a
// verified principal attribute the storage PDP evaluates, never an assertion.
message RefUpdateContext {
  string tenant_id = 1;
  string repository_id = 2;
  string actor_id = 3;
  string request_id = 4;
  repeated string actor_roles = 5;
}

// MergeRefRequest moves target_ref to revision.
//
// expected_current_revision makes the move a compare-and-swap: storage applies it
// only if the ref is still where the caller last saw it, so a merge decided
// against one state cannot land on a different one. An empty value means the ref
// is expected not to exist yet.
//
// Deliberately absent: a force flag, a delete, a pattern, an approval count, a
// protection result, and an allow flag. None of them can be expressed here, which
// is what keeps this narrower than a ref-write API.
message MergeRefRequest {
  RefUpdateContext context = 1;
  // An exact refs/heads/... name. Pattern syntax is not accepted.
  string target_ref = 2;
  // An existing revision in this repository; storage refuses an unknown one.
  string revision = 3;
  string expected_current_revision = 4;
}

// MergeRefResponse reports the ref's new revision. A refused move returns a coarse
// error and no partial state, in the same shape as any other storage refusal.
message MergeRefResponse {
  string target_ref = 1;
  string revision = 2;
}

// ImportRefsRequest carries the import's git phase to storage. The source URL is
// a request-only secret: it never becomes an event, an audit record, a log line,
// or an error. The token is a request-only secret too, and must never be stored.
message ImportRefsRequest {
  OperationContext context = 1;
  // The source repository URL (https or ssh). Never stored, never logged.
  string source_url = 2;
  // Optional bearer token for a private source. Request-only, never stored.
  string source_token = 3;
}

// ImportRefsResponse reports the refs that moved. A refused import returns a
// coarse error and no partial state.
message ImportRefsResponse {
  // One entry per ref that moved, with the new revision.
  repeated RefUpdate refs = 1;
  // Bytes this fetch wrote for the tenant, counted after the write was
  // acknowledged rather than attempted, so the number is what the tenant now
  // stores. The caller charges them to the tenant's fair-use storage dimension,
  // which only storage can measure (SPEC-0011 AC21, PRD §6 G8). Zero means the
  // fetch wrote nothing new.
  int64 imported_bytes = 2;
}

message RefUpdate {
  string ref = 1;
  string revision = 2;
}
