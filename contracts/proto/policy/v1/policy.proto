syntax = "proto3";

// The Policy Decision Point (ADR-0006, SPEC-0002).
//
// Every authorization answer in the system comes from here. No caller may decide for itself whether
// an action is permitted — invariant 2 forbids inline permission logic, and this service is what
// makes that a real alternative rather than an aspiration.
//
// SYNCHRONOUS ON PURPOSE, against the usual preference for events (contracts/README.md, invariant
// 17). A PEP cannot proceed until it knows the answer: an authorization decision is the one case
// where the caller genuinely needs a direct response, because the alternative to waiting is acting
// without a decision, which is the thing being prevented.
//
// WHAT IS NOT HERE. No rule content, no bundle contents, no policy management RPCs. Policies are
// authored and reviewed in governance/policies (invariant 21) and shipped as OPA bundles; a service
// that could push rules over the wire would be a way to change policy without review, which is
// precisely what ADR-0006 exists to prevent. Policy *authoring* is out of scope for SPEC-0002.

package gitsaas.policy.v1;

option go_package = "github.com/yourorg/gitsaas/gen/proto/policy/v1;policyv1";

import "google/protobuf/timestamp.proto";

// PolicyDecisionPoint answers "may this subject do this to that?" and nothing else.
service PolicyDecisionPoint {
  // Decide evaluates one action against the loaded policy bundle.
  //
  // Unary rather than streaming: a decision is a question and an answer, and each one must be
  // independently attributable in the audit trail (SPEC-0003). Batching would make a partial
  // failure ambiguous — and "some of these were allowed" is not a safe thing to be vague about.
  rpc Decide(DecideRequest) returns (DecideResponse);

  // EvaluateDryRun evaluates a candidate bundle over a bounded range of
  // historical decision inputs and reports what it *would* have decided,
  // without enforcing anything (SPEC-0029 AC2, SPEC-0030).
  //
  // Unary rather than streaming for the same reason Decide is: each would-be
  // decision must be independently attributable in the audit trail, and a
  // partial failure over a range must not be vague about which inputs it
  // covered. A dry-run that enforces nothing and changes no state is still an
  // auditable operation, because it is how a rule's effect becomes knowable
  // before it binds.
  rpc EvaluateDryRun(EvaluateDryRunRequest) returns (EvaluateDryRunResponse);

  // GetDecision retrieves a decision record by the ID the PDP assigned it,
  // with the provenance it was made under (SPEC-0029 AC1, SPEC-0030).
  //
  // Retrieval is the other half of "every decision records the version that
  // decided it": a decision is only useful as evidence if it can be read back,
  // by ID, with its deciding bundle revision, input digest and mode.
  rpc GetDecision(GetDecisionRequest) returns (GetDecisionResponse);
  // GetBundleStatus reports which policy bundle is in force. Additive for
  // SPEC-0055.
  //
  // Read only, and note what this service still has no verb for: writing a
  // policy. ADR-0073 records why that is structural rather than missing —
  // policies live in governance/ and ADR-0001 makes governance the Source of
  // Truth, so a web form that writes policy is a second source of truth for
  // the same decisions. check-contracts.sh check 14 asserts no RPC here begins
  // Put, Create, Update, Delete or Author, so the deferral is a property of
  // the contract rather than an intention someone remembers.
  rpc GetBundleStatus(GetBundleStatusRequest) returns (GetBundleStatusResponse);
}

// Subject is the principal an action is attributed to.
message Subject {
  // Stable principal identifier. Empty means anonymous, which is a legitimate subject to ask
  // about — the policy decides what an anonymous caller may do, rather than the PEP guessing.
  string id = 1;

  // Roles the subject holds within the request's tenant. Carried in the request rather than looked
  // up by the PDP so the decision is a pure function of its input: the same request always yields
  // the same answer, which is what makes the response cacheable at all (AC3).
  repeated string roles = 2;

  // The tenant this subject belongs to. Compared against DecideRequest.tenant_id by policy — a
  // subject from one tenant asking about another's resource is a denial the PDP must be able to
  // see, so both values are carried rather than assumed equal (invariant 1).
  string tenant_id = 3;
}

// Resource is what the action would be performed on.
message Resource {
  // The kind of thing — "repository", "merge_request". A stable vocabulary, deliberately a string
  // for the same reason `action` is: a new resource kind should be additive by construction.
  string type = 1;

  // Opaque identifier within that type. Never a URL and never the resource's contents — the same
  // rule the audit contract states, and for the same reason (G1).
  string id = 2;
}

// DecideRequest asks whether one action is permitted.
message DecideRequest {
  // The tenant the request is being made under. Every decision is tenant-scoped (invariant 1);
  // a request without one is denied by policy rather than evaluated against a global rule set.
  string tenant_id = 1;

  Subject subject = 2;

  // What the subject wants to do, as a stable dotted vocabulary — e.g. "repo.read". A string
  // rather than an enum, matching the audit contract's `action`: an enum would make every new
  // protected action a contracts change and a coordinated deploy across every PEP.
  string action = 3;

  Resource resource = 4;

  // Additional request attributes policy may consider — IP, protocol, whether the branch is
  // protected. Small, non-sensitive values only; never credentials and never resource contents.
  //
  // This is also the cache key's tail: two requests differing only here are different decisions,
  // so a PEP must not drop attributes it considers irrelevant (AC3).
  map<string, string> context = 5;
}

// DecideResponse is the PDP's answer.
message DecideResponse {
  // Whether the action is permitted.
  //
  // A bool rather than an enum, and this is the one place in contracts/ where that is the safer
  // choice. Deny-by-default (ADR-0006) has to survive every failure mode, including a response
  // that never got populated: proto3's zero value for a bool is false, so a dropped field, an
  // older server, or a zero-valued response all read as *deny*. An enum's zero value would be
  // OUTCOME_UNSPECIFIED, and a caller treating "unspecified" as anything but denial would have
  // inverted the invariant. The wire default is the safe default here, so it is used deliberately.
  bool allowed = 1;

  // Why, in terms safe to return to the caller.
  //
  // Deny reasons are deliberately coarse. A precise explanation of *which* condition failed turns
  // this service into an oracle: repeated probing would reveal which repositories exist and which
  // roles a subject lacks, which is the information RLS and deny-by-default exist to withhold.
  // The full reasoning belongs in the audit trail (SPEC-0003), not in the response.
  string reason = 2;

  // The bundle revision that produced this decision (the OPA bundle's `.manifest` revision).
  //
  // This is what makes caching correct rather than merely fast (AC3). A cached decision is only
  // valid for the policy it was computed under, so a PEP keys its cache on this value and a bundle
  // change invalidates every entry without anyone having to remember to flush anything.
  string policy_revision = 3;

  // ULID identifying this decision, so the audit event recording it can be correlated with the
  // request that asked. Assigned by the PDP: a caller that could name its own decision could also
  // claim a different one's outcome.
  string decision_id = 4;

  // Digest over the canonicalized decision input (SPEC-0030). Server-produced:
  // an auditor re-derives it from the input the decision was made over, and a
  // caller has no request field to supply it in. It is what lets an evidence
  // pack state not only that a decision was made but over exactly what input.
  string input_digest = 5;

  // The evaluation mode of this decision (SPEC-0029 AC2, SPEC-0030). Decide
  // always returns EVALUATION_MODE_ENFORCED; only EvaluateDryRun produces
  // EVALUATION_MODE_DRY_RUN. Server-produced — no request carries a mode.
  EvaluationMode mode = 6;
}

// EvaluationMode distinguishes an enforced decision from a dry-run one
// (SPEC-0029 AC2, SPEC-0030). A dry-run decision is never an authorization
// outcome and is labelled wherever it appears, so a consumer can never mistake
// it for an enforced control — and a caller has no way to assert either value.
enum EvaluationMode {
  EVALUATION_MODE_UNSPECIFIED = 0;
  // The decision was enforced: it gated a real action and was recorded as a
  // control in the audit trail.
  EVALUATION_MODE_ENFORCED = 1;
  // The decision is a dry-run: what a candidate bundle would have decided. It
  // writes no enforcement, mutates no state, and is never consumed as an
  // authorization outcome.
  EVALUATION_MODE_DRY_RUN = 2;
}

// EvaluateDryRunRequest asks the PDP to replay a bounded range of historical
// decision inputs through a candidate bundle (SPEC-0029 AC2, SPEC-0030).
//
// The caller names WHICH bundle to evaluate and WHICH history to replay; it
// supplies no provenance and no outcome. There is no decision_id, no mode, no
// input_digest, no bundle revision and no allowed flag here — every one of
// those is produced by the server for each would-be decision, so a caller
// cannot assert a dry-run result any more than it can assert a live one
// (SPEC-0030 AC2).
message EvaluateDryRunRequest {
  // The tenant the dry-run runs under. Every dry-run is tenant-scoped
  // (invariant 1); a cross-tenant range is a coarse denial that does not
  // distinguish nonexistent from unauthorized (SPEC-0030 AC6).
  string tenant_id = 1;

  // The candidate bundle to evaluate, as a reference to reviewed policy code
  // in governance/ (SPEC-0029 reading A). A reference names reviewed,
  // immutable code — never inline content and never a tenant-authored record —
  // so a dry-run cannot become a way to evaluate policy that skipped review.
  string candidate_bundle_ref = 2;

  // The bounded range of historical decision inputs to replay. The inputs are
  // read from the server's own decision history, never supplied by the caller.
  HistoricalRange range = 3;

  // Upper bound on the number of would-be decisions a single dry-run may
  // produce. A range that would exceed it is rejected rather than silently
  // truncated (SPEC-0030 open question): the caller narrows the range instead
  // of receiving a partial result that looks complete.
  int32 max_results = 4;
}

// HistoricalRange delimits the historical decision inputs a dry-run replays.
// Empty/absent on a bound leaves that dimension unbounded; the server enforces
// the overall cap from EvaluateDryRunRequest.max_results.
message HistoricalRange {
  // Restrict to one action, e.g. "merge_request.merge". Empty replays every
  // action.
  string action = 1;

  // Restrict to one resource. Absent replays every resource.
  Resource resource = 2;

  // Inclusive lower bound on when the replayed decisions were recorded. Absent
  // is unbounded below.
  google.protobuf.Timestamp from = 3;

  // Inclusive upper bound. Absent is unbounded above.
  google.protobuf.Timestamp to = 4;
}

// EvaluateDryRunResponse is the set of would-be decisions a dry-run produced.
message EvaluateDryRunResponse {
  // One would-be decision per replayed input. Every entry carries
  // mode = EVALUATION_MODE_DRY_RUN and the candidate bundle's revision as its
  // policy_revision, so a dry-run record is distinguishable from an enforced
  // one everywhere it appears — including any later evidence section
  // (SPEC-0029 AC2).
  repeated DecideResponse decisions = 1;
}

// GetDecisionRequest retrieves one decision record by the ID the PDP assigned.
//
// The decision_id here is a SELECTOR, not an assertion: the caller can only
// name a decision the server already produced and returned. It supplies no
// outcome, no mode, no revision and no input digest — the record that comes
// back carries those as server-produced facts (SPEC-0030 AC2).
message GetDecisionRequest {
  // The tenant the read runs under. A decision is only ever retrievable within
  // the tenant that made it; a cross-tenant or nonexistent ID yields the same
  // coarse denial (invariant 1, SPEC-0030 AC6).
  string tenant_id = 1;

  // The decision to retrieve, as assigned by the PDP in a prior response.
  string decision_id = 2;
}

// DecisionRecord is one stored decision, retrievable after the fact
// (SPEC-0029 AC1, SPEC-0030). It carries the provenance the decision was made
// under and the outcome, but never the rule source text: exposing the rules on
// this surface would be a way to read policy that skipped the governance review
// the bundle went through (G9).
message DecisionRecord {
  // The decision's identity and provenance — all server-produced.
  string decision_id = 1;

  // The bundle revision that decided it: the deciding policy version, which is
  // what makes the record useful as evidence (SPEC-0029 AC1).
  string policy_revision = 2;

  // Digest over the canonicalized input the decision was made over.
  string input_digest = 3;

  // ENFORCED or DRY_RUN. A dry-run record stays labelled here exactly as it
  // does in the audit chain (SPEC-0029 AC2).
  EvaluationMode mode = 4;

  // The question that was asked.
  string tenant_id = 5;

  // The actor the action was attributed to.
  string actor_id = 6;

  string action = 7;

  Resource resource = 8;

  // The answer and when it was given.
  bool allowed = 9;

  google.protobuf.Timestamp decided_at = 10;
}

// GetDecisionResponse returns the retrieved decision record.
message GetDecisionResponse {
  // Absent when no such decision exists in this tenant; absence and denial are
  // the same coarse shape (SPEC-0001, SPEC-0030 AC6).
  DecisionRecord record = 1;
}

message GetBundleStatusRequest {
  // The tenant the read runs under. Every read is tenant-scoped (invariant 1),
  // even one whose answer is the same platform bundle for everyone: the caller
  // must still be a verified caller.
  string tenant_id = 1;
}
// The bundle in force. Deliberately no policy SOURCE: the bundle is a platform
// artifact and its contents are not a tenant read (SPEC-0055 out of scope).
message GetBundleStatusResponse {
  string bundle_revision = 1;
  string loaded_at = 2;
}
