syntax = "proto3";

// The Policy Decision Point (ADR-0006, SPEC-0002).
//
// Every authorization answer in the system comes from here. No caller may decide for itself whether
// an action is permitted — invariant 2 forbids inline permission logic, and this service is what
// makes that a real alternative rather than an aspiration.
//
// SYNCHRONOUS ON PURPOSE, against the usual preference for events (contracts/README.md, invariant
// 17). A PEP cannot proceed until it knows the answer: an authorization decision is the one case
// where the caller genuinely needs a direct response, because the alternative to waiting is acting
// without a decision, which is the thing being prevented.
//
// WHAT IS NOT HERE. No rule content, no bundle contents, no policy management RPCs. Policies are
// authored and reviewed in governance/policies (invariant 21) and shipped as OPA bundles; a service
// that could push rules over the wire would be a way to change policy without review, which is
// precisely what ADR-0006 exists to prevent. Policy *authoring* is out of scope for SPEC-0002.

package gitsaas.policy.v1;

option go_package = "github.com/yourorg/gitsaas/gen/proto/policy/v1;policyv1";

// PolicyDecisionPoint answers "may this subject do this to that?" and nothing else.
service PolicyDecisionPoint {
  // Decide evaluates one action against the loaded policy bundle.
  //
  // Unary rather than streaming: a decision is a question and an answer, and each one must be
  // independently attributable in the audit trail (SPEC-0003). Batching would make a partial
  // failure ambiguous — and "some of these were allowed" is not a safe thing to be vague about.
  rpc Decide(DecideRequest) returns (DecideResponse);
}

// Subject is the principal an action is attributed to.
message Subject {
  // Stable principal identifier. Empty means anonymous, which is a legitimate subject to ask
  // about — the policy decides what an anonymous caller may do, rather than the PEP guessing.
  string id = 1;

  // Roles the subject holds within the request's tenant. Carried in the request rather than looked
  // up by the PDP so the decision is a pure function of its input: the same request always yields
  // the same answer, which is what makes the response cacheable at all (AC3).
  repeated string roles = 2;

  // The tenant this subject belongs to. Compared against DecideRequest.tenant_id by policy — a
  // subject from one tenant asking about another's resource is a denial the PDP must be able to
  // see, so both values are carried rather than assumed equal (invariant 1).
  string tenant_id = 3;
}

// Resource is what the action would be performed on.
message Resource {
  // The kind of thing — "repository", "merge_request". A stable vocabulary, deliberately a string
  // for the same reason `action` is: a new resource kind should be additive by construction.
  string type = 1;

  // Opaque identifier within that type. Never a URL and never the resource's contents — the same
  // rule the audit contract states, and for the same reason (G1).
  string id = 2;
}

// DecideRequest asks whether one action is permitted.
message DecideRequest {
  // The tenant the request is being made under. Every decision is tenant-scoped (invariant 1);
  // a request without one is denied by policy rather than evaluated against a global rule set.
  string tenant_id = 1;

  Subject subject = 2;

  // What the subject wants to do, as a stable dotted vocabulary — e.g. "repo.read". A string
  // rather than an enum, matching the audit contract's `action`: an enum would make every new
  // protected action a contracts change and a coordinated deploy across every PEP.
  string action = 3;

  Resource resource = 4;

  // Additional request attributes policy may consider — IP, protocol, whether the branch is
  // protected. Small, non-sensitive values only; never credentials and never resource contents.
  //
  // This is also the cache key's tail: two requests differing only here are different decisions,
  // so a PEP must not drop attributes it considers irrelevant (AC3).
  map<string, string> context = 5;
}

// DecideResponse is the PDP's answer.
message DecideResponse {
  // Whether the action is permitted.
  //
  // A bool rather than an enum, and this is the one place in contracts/ where that is the safer
  // choice. Deny-by-default (ADR-0006) has to survive every failure mode, including a response
  // that never got populated: proto3's zero value for a bool is false, so a dropped field, an
  // older server, or a zero-valued response all read as *deny*. An enum's zero value would be
  // OUTCOME_UNSPECIFIED, and a caller treating "unspecified" as anything but denial would have
  // inverted the invariant. The wire default is the safe default here, so it is used deliberately.
  bool allowed = 1;

  // Why, in terms safe to return to the caller.
  //
  // Deny reasons are deliberately coarse. A precise explanation of *which* condition failed turns
  // this service into an oracle: repeated probing would reveal which repositories exist and which
  // roles a subject lacks, which is the information RLS and deny-by-default exist to withhold.
  // The full reasoning belongs in the audit trail (SPEC-0003), not in the response.
  string reason = 2;

  // The bundle revision that produced this decision (the OPA bundle's `.manifest` revision).
  //
  // This is what makes caching correct rather than merely fast (AC3). A cached decision is only
  // valid for the policy it was computed under, so a PEP keys its cache on this value and a bundle
  // change invalidates every entry without anyone having to remember to flush anything.
  string policy_revision = 3;

  // ULID identifying this decision, so the audit event recording it can be correlated with the
  // request that asked. Assigned by the PDP: a caller that could name its own decision could also
  // claim a different one's outcome.
  string decision_id = 4;
}
