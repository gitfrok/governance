syntax = "proto3";

// The residency Declare admin surface (SPEC-0043, T-0038, ADR-0063).
//
// Declare is a control-plane admin gRPC surface: an operator sets or replaces
// a tenant's residency declaration — the cloud and region its work is pinned
// to — and the surface is a PEP. It asks the PDP action
// residency.declaration.set and refuses coarsely when refused; it authorizes
// nothing itself (ADR-0063 decision 3). Every declaration, replacement and
// refusal appends exactly one immutable audit record naming the tenant, the
// verified actor, the previous and new pinning, and the effective time
// (SPEC-0043 AC1).
//
// THE SUBJECT IS NEVER ON THIS WIRE. No message in this package carries a
// tenant, actor or role field, and scripts/check-contracts.sh asserts that
// against the COMPILED descriptor: the subject is the verified principal on
// the call (ADR-0045 — one verified identity source; caller input never
// chooses tenant, actor or roles), established through the credential
// verification path before the PDP is asked (SPEC-0043 AC6). The tenant a
// declaration applies to is the one the verified principal is scoped to; a
// field naming it would be an unauthenticated routing claim (ADR-0045,
// ADR-0067 rejected alternatives). A vendor declaring on a tenant's behalf is
// answered by WHO THE PRINCIPAL IS — the tenant-scoped platform operator of
// ADR-0046, extended to this action by ADR-0067 — never by a message field.
//
// The agent channel never declares: it only reports witnessed placement facts
// (ADR-0063 decision 5), and agent/v1 gains nothing from this surface.
package gitsaas.residency.v1;

option go_package = "github.com/yourorg/gitsaas/gen/proto/residency/v1;residencyv1";

import "google/protobuf/timestamp.proto";

service ResidencyService {
  // DeclareResidency sets or replaces the declaration of the tenant the
  // verified caller is scoped to. Declaring and replacing are the same act —
  // the PDP question is residency.declaration.set either way — and a replace
  // appends a new effective-dated declaration and retains the history
  // (ADR-0063 decision 2, ADR-0062 decision 6): the surface changes what is
  // in force, never what was in force before it. The caller supplies cloud
  // and region only; identity and the effective time are server facts
  // (SPEC-0040 AC1), and not-found, cross-tenant, unverified and
  // unauthorized are the same coarse refusal (SPEC-0001).
  rpc DeclareResidency(DeclareResidencyRequest) returns (DeclareResidencyResponse);
}

// DeclareResidencyRequest carries the declaration payload and NOTHING ELSE.
// There is deliberately no tenant, actor, role, effective-time or outcome
// field: the tenant and the actor are properties of the verified principal
// on the call, the effective time is the server's instant the declaration is
// witnessed, and a caller cannot assert any of them (SPEC-0043 AC6). The
// vocabulary mirrors the residency domain declaration (backend/modules/
// residency/api): a caller supplies cloud and region only.
message DeclareResidencyRequest {
  // The cloud the tenant's work is pinned to, e.g. the cloud provider.
  string cloud = 1;
  // The region within that cloud, e.g. "europe-west1".
  string region = 2;
}

// DeclareResidencyResponse is the declaration now in force as control-plane
// state: the pinning, the server-set effective time, and the chain position
// of the immutable audit record witnessing the act (ADR-0007) — the same
// facts the residency domain records. It names no tenant and no actor: the
// caller is the verified principal it called as, and the audit record is
// where the compliance reader finds who acted and under which grant
// (ADR-0067 decision 3).
message DeclareResidencyResponse {
  // The pinning now in force.
  string cloud = 1;
  string region = 2;
  // The server's instant the declaration was witnessed — the instant it
  // takes effect. A server fact, never a caller input (SPEC-0040 AC1).
  google.protobuf.Timestamp effective_at = 3;
  // The chain position of the immutable audit record witnessing this
  // declaration (ADR-0007): the facts a pack consumer uses to re-derive the
  // citation from the tenant's chain.
  int64 chain_seq = 4;
  string record_hash = 5;
}
