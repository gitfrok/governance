syntax = "proto3";

// Internal Security/Findings surface for ingesting completed scan results,
// reading findings, triaging findings, and reading dashboard summaries
// (SPEC-0024, SPEC-0025, SPEC-0026, SPEC-0027).
//
// Security/Findings owns findings, their identities, scan records, provenance
// blobs, triage records and their history, and idempotency keys. A finding's
// identity is computed server-side from a fixed input set (SPEC-0024); no
// request carries a finding identity, a lifecycle state, or a first-seen
// value, and no request carries an authorization outcome. Triage is a
// resource keyed by finding identity, never a field of the finding message:
// that shape is what lets a triage state survive a re-scan by construction
// (SPEC-0027). Ingest, read, triage and summary are PDP decisions with
// server-derived context (ADR-0006); scanner-native payloads cross this
// boundary only as opaque provenance bytes (SPEC-0025 AC6).
package gitsaas.security.v1;

option go_package = "github.com/yourorg/gitsaas/gen/proto/security/v1;securityv1";

import "google/protobuf/timestamp.proto";

service FindingsService {
  // IngestScanResults ingests one bounded, chunkable batch of a completed
  // scan's normalized findings. Idempotent per tenant, scan, and request ID:
  // replaying a request creates no duplicate finding, event, or audit record
  // (SPEC-0025 AC1). A partially delivered batch leaves no half-ingested
  // scan visible to a reader.
  rpc IngestScanResults(IngestScanResultsRequest) returns (IngestScanResultsResponse);
  // GetFinding returns one finding. Not-found, cross-tenant, and
  // unauthorized are the same coarse denial (SPEC-0001).
  rpc GetFinding(GetFindingRequest) returns (GetFindingResponse);
  // ListFindings pages a tenant-scoped, filtered list of findings. Cursors
  // are opaque, signed, and bound to the tenant and revision that issued
  // them; a forged or cross-tenant cursor yields no content (SPEC-0025).
  rpc ListFindings(ListFindingsRequest) returns (ListFindingsResponse);
  // SetTriage records a triage decision on a finding identity. It is a
  // control action, not a UI preference: the transition is a PDP decision
  // with server-derived context and appends exactly one immutable audit
  // record (SPEC-0026 AC4). Guarded by expected version and idempotent per
  // request ID; a superseded record is retained, never mutated
  // (SPEC-0026 AC5, SPEC-0027).
  rpc SetTriage(SetTriageRequest) returns (SetTriageResponse);
  // GetTriage reads the triage record attached to a finding identity — the
  // latest, or an exact superseded version by request (SPEC-0027 AC6).
  // Not-found, cross-tenant, and unauthorized are the same coarse denial
  // (SPEC-0001).
  rpc GetTriage(GetTriageRequest) returns (GetTriageResponse);
  // GetFindingsSummary returns counts and facet values for the unified
  // dashboard, computed under the caller's authorization: the authorization
  // filter is part of the query, not a mask applied late, and a facet value
  // that exists only in a repository the caller may not read is absent,
  // not zero (SPEC-0026 AC6, SPEC-0027 AC4).
  rpc GetFindingsSummary(GetFindingsSummaryRequest) returns (GetFindingsSummaryResponse);
}

// FindingsContext is derived from an authenticated principal by the PEP.
// The actor ID and roles are verified server-side; a caller cannot assert
// them. An empty or cross-tenant context is a coarse denial that does not
// distinguish nonexistent from unauthorized (SPEC-0025).
message FindingsContext {
  string tenant_id = 1;
  string repository_id = 2;
  string actor_id = 3;
  repeated string actor_roles = 4;
  string request_id = 5;
}

// ScannerClass is the one-of-five scanner classes the normalized model
// covers (SPEC-0024 AC1). Adding a scanner class is an additive enum value;
// adding a scanner needs no model change (SPEC-0024 AC6).
enum ScannerClass {
  SCANNER_CLASS_UNSPECIFIED = 0;
  SCANNER_CLASS_SAST = 1;
  SCANNER_CLASS_DEPENDENCY = 2;
  SCANNER_CLASS_SECRETS = 3;
  SCANNER_CLASS_CONTAINER = 4;
  SCANNER_CLASS_DAST = 5;
}

// FindingSeverity is the one normalized severity scale across scanner classes
// (SPEC-0025). The tool's native severity is preserved in provenance; it
// never travels as a first-class field.
enum FindingSeverity {
  FINDING_SEVERITY_UNSPECIFIED = 0;
  FINDING_SEVERITY_LOW = 1;
  FINDING_SEVERITY_MEDIUM = 2;
  FINDING_SEVERITY_HIGH = 3;
  FINDING_SEVERITY_CRITICAL = 4;
}

// FindingLifecycle is server-computed state. A finding that a later scan no
// longer reports is RESOLVED, never deleted (SPEC-0024 AC9). A caller cannot
// supply a lifecycle value: it appears in no request message.
enum FindingLifecycle {
  FINDING_LIFECYCLE_UNSPECIFIED = 0;
  FINDING_LIFECYCLE_OPEN = 1;
  FINDING_LIFECYCLE_RESOLVED = 2;
}

// TriageState is the one decision vocabulary a triage record carries
// (SPEC-0026): accept the risk, mark the finding a false positive, fix it,
// or defer the decision. UNSPECIFIED is not a state a record can hold; in a
// FindingTriaged event it names the absence of any prior state.
enum TriageState {
  TRIAGE_STATE_UNSPECIFIED = 0;
  TRIAGE_STATE_ACCEPT = 1;
  TRIAGE_STATE_FALSE_POSITIVE = 2;
  TRIAGE_STATE_FIX = 3;
  TRIAGE_STATE_DEFER = 4;
}

// FindingLocation is the content-derived half of a finding's identity input
// set (SPEC-0024). Its components are derived from content, not from a
// commit or an absolute line number: identity must survive an unrelated edit
// that shifts lines. For dependency and container findings the affected
// component and version stand in place of a file location.
message FindingLocation {
  // The artifact within the repository the finding sits in.
  string artifact_path = 1;
  // The enclosing content that carries the finding, content-derived
  // (normalized snippet or enclosing symbol). The exact construction is an
  // implementation choice constrained by SPEC-0024 AC2/AC3.
  string enclosing_content = 2;
  // Dependency and container findings: the affected component.
  string component = 3;
  // Dependency and container findings: the affected component's version.
  string component_version = 4;
}

// RawFinding is one normalized finding as an adapter delivers it. It
// deliberately carries no identity, no lifecycle state, and no first-seen
// value: identity is computed server-side per SPEC-0024, lifecycle is
// server state, and first-seen is server history — a request that would
// carry them has no fields to carry them in (SPEC-0025 AC3).
message RawFinding {
  // The rule the reporting tool fired on. Together with the scan
  // descriptor's tool identity and the location, this is the
  // per-finding half of the identity input set.
  string rule_id = 1;
  FindingSeverity severity = 2;
  FindingLocation location = 3;
  // The scanner-native payload, carried byte-for-byte and never interpreted
  // by the domain (SPEC-0025 AC6). Malformed or oversized blobs are
  // rejected at the boundary without partial ingest.
  bytes provenance = 4;
  // The media type of the provenance blob, e.g.
  // "application/sarif+json". Provenance round-trips only with it.
  string provenance_media_type = 5;
}

// ScanDescriptor names the tool that produced a batch. Tool identity is part
// of the identity input set: the same defect reported by two tools is two
// findings, never one (SPEC-0024 AC3).
message ScanDescriptor {
  ScannerClass scanner_class = 1;
  // The reporting tool's identity, e.g. its name. Distinct tools never
  // collapse into one identity.
  string tool_name = 2;
  string tool_version = 3;
  google.protobuf.Timestamp scan_started_at = 4;
  google.protobuf.Timestamp scan_ended_at = 5;
}

// IngestScanResultsRequest carries a completed scan's batch of normalized
// findings. It accepts no finding identity, no lifecycle state, and no
// first-seen value — those are server-computed (SPEC-0025 AC3) — and no
// authorization outcome: the PDP alone answers allow or deny.
message IngestScanResultsRequest {
  FindingsContext context = 1;
  // The opaque revision the scan ran against. Identity is invariant to it
  // (SPEC-0024); it is recorded so reads can name what was scanned.
  string revision = 2;
  ScanDescriptor scan = 3;
  // One bounded batch. A large scan arrives as consecutive chunks of the
  // same scan; nothing of the scan is visible to a reader until the final
  // chunk completes.
  repeated RawFinding findings = 4;
  // The chunk's zero-based position within the scan's batch sequence.
  int32 chunk_index = 5;
  // True when this chunk completes the scan's batch.
  bool final_chunk = 6;
}

message IngestScanResultsResponse {
  // The server-assigned opaque identity of the scan record.
  string scan_id = 1;
  // How many findings this request recorded. A replay of the same request
  // ID reports the same outcome and creates nothing new (SPEC-0025 AC1).
  int64 findings_recorded = 2;
}

message GetFindingRequest {
  FindingsContext context = 1;
  // The opaque, server-assigned finding identity. A caller can only ever
  // refer to a finding by what the server computed and returned.
  string finding_id = 2;
}

message GetFindingResponse {
  Finding finding = 1;
}

// Finding is the normalized shape every scanner class lands in (SPEC-0024
// AC1). It deliberately excludes filesystem paths outside the repository,
// credentials, scanner API tokens, policy outcomes, triage state, and audit
// sequences — none of those is representable in v1 (SPEC-0025).
message Finding {
  // The opaque, server-computed identity (SPEC-0024 identity rule).
  string finding_id = 1;
  string tenant_id = 2;
  string repository_id = 3;
  ScannerClass scanner_class = 4;
  // The reporting tool, as delivered in the scan descriptor.
  string tool_name = 5;
  string tool_version = 6;
  // The rule the tool fired on.
  string rule_id = 7;
  FindingSeverity severity = 8;
  FindingLocation location = 9;
  FindingLifecycle lifecycle = 10;
  // Server history: the scans that first and last reported this finding.
  // A finding a later scan no longer reports keeps its identity and history
  // as RESOLVED (SPEC-0024 AC9).
  string first_seen_scan_id = 11;
  string last_seen_scan_id = 12;
  // The scanner-native payload, stored and returned byte-for-byte with its
  // media type; the domain never parses it (SPEC-0025 AC6).
  bytes provenance = 13;
  string provenance_media_type = 14;
}

// ListFindingsRequest pages a tenant-scoped list. An UNSPECIFIED enum, an
// empty string, or a zero bound is no filter for its dimension, and filters
// combine (SPEC-0026 AC2): the same filter set yields the same result set
// on repeat. Counts and facets obey the same authorization as the result
// list: no count, facet, or "more results" indicator may reveal a finding
// the caller may not read (SPEC-0025, SPEC-0026 AC6).
message ListFindingsRequest {
  FindingsContext context = 1;
  // Filters: repository, scanner class, severity, and lifecycle state are
  // the SPEC-0025 set.
  string repository_filter = 2;
  ScannerClass scanner_class_filter = 3;
  FindingSeverity severity_filter = 4;
  FindingLifecycle lifecycle_filter = 5;
  // Zero means the server's default page size.
  int32 page_size = 6;
  // An opaque cursor from a previous response: signed and bound to the
  // tenant and revision that issued it. A forged, expired, or cross-tenant
  // cursor yields no content (SPEC-0025). Empty starts at the first page.
  string page_token = 7;
  // Dashboard filters (SPEC-0026 AC2). Age is measured in whole days since
  // the finding was first seen; zero on either bound leaves that side
  // unbounded.
  int32 min_age_days = 8;
  int32 max_age_days = 9;
  // The owning team, as an opaque identifier fed by Identity & Access
  // (SPEC-0026). Empty is no filter.
  string owning_team_filter = 10;
}

message ListFindingsResponse {
  repeated Finding findings = 1;
  // Empty when this is the last page. Its presence or absence is itself
  // authorization-derived: it never indicates further findings the caller
  // may not read (SPEC-0026 AC6).
  string next_page_token = 2;
}

// TriageRecord is one triage decision attached to a finding identity — a
// resource of its own, never a field of the finding message (SPEC-0027).
// That separation is what makes "survives a re-scan" true by construction:
// a later scan re-reports the finding identity and the record, keyed to it,
// is untouched. Records are immutable once written; superseding a decision
// appends a new record with a higher version and retains the old one
// (SPEC-0026 AC5, SPEC-0027 AC6).
message TriageRecord {
  // The opaque, server-assigned identity of the triage record.
  string triage_id = 1;
  // The finding identity this record is keyed to (SPEC-0024 identity rule).
  string finding_id = 2;
  string tenant_id = 3;
  string repository_id = 4;
  TriageState state = 5;
  // The bounded, caller-supplied justification. Whether a state requires a
  // non-empty one is a product decision the contract does not settle
  // (SPEC-0027); the field is carried either way and travels in no event.
  string justification = 6;
  // The server-assigned positive version within the finding's triage
  // history. Versions are dense and ascending; a higher version supersedes
  // the lower ones without erasing them.
  int64 version = 7;
  // The verified actor who recorded the decision, from authenticated
  // identity — never a caller assertion.
  string actor_id = 8;
  google.protobuf.Timestamp occurred_at = 9;
}

// SetTriageRequest records a triage decision. It deliberately carries no
// severity, no lifecycle state, and no authorization flag: those are server
// facts, and a request that would assert them has no fields to assert them
// in (SPEC-0027). Idempotency is keyed on the context's request ID.
message SetTriageRequest {
  FindingsContext context = 1;
  // The opaque, server-assigned identity of the finding to triage.
  string finding_id = 2;
  // The decision being recorded. UNSPECIFIED is rejected: clearing a
  // decision is not a v1 operation — history is only superseded, never
  // erased (SPEC-0026 AC5).
  TriageState state = 3;
  string justification = 4;
  // The version of the triage record the caller expects to supersede: the
  // version last read. Zero expects no record at all. A mismatch changes no
  // state and reports the current record, so concurrent triage resolves by
  // re-read rather than by last-write-wins (SPEC-0027 AC1).
  int64 expected_version = 5;
}

message SetTriageResponse {
  // The record now in force: the one this request wrote, or — on a replayed
  // request ID or a version mismatch — the one already there. A replay
  // creates no duplicate record, event, or audit entry (SPEC-0027 AC1).
  TriageRecord record = 1;
}

// GetTriageRequest reads a finding's triage record.
message GetTriageRequest {
  FindingsContext context = 1;
  string finding_id = 2;
  // The exact history version to read. Zero reads the latest. Superseded
  // versions stay retrievable with their actor, timestamp and justification
  // (SPEC-0027 AC6).
  int64 version = 3;
}

message GetTriageResponse {
  // Absent when the finding carries no triage record (or none at that
  // version). Absence and denial are the same coarse shape (SPEC-0001).
  TriageRecord record = 1;
}

// GetFindingsSummaryRequest asks for counts and facets under the same
// filters ListFindings accepts. It names no repository allow-list and
// carries no authorization flag: the caller's readable scope is derived
// server-side, and an org-wide summary is the same request with no
// repository filter (SPEC-0026 AC1).
message GetFindingsSummaryRequest {
  FindingsContext context = 1;
  // The dashboard filter set, with the same UNSPECIFIED/empty/zero
  // semantics as ListFindingsRequest.
  string repository_filter = 2;
  ScannerClass scanner_class_filter = 3;
  FindingSeverity severity_filter = 4;
  FindingLifecycle lifecycle_filter = 5;
  int32 min_age_days = 6;
  int32 max_age_days = 7;
  string owning_team_filter = 8;
  // The facet dimensions requested, e.g. "severity", "scanner_class",
  // "lifecycle", "owning_team". Unknown dimensions are rejected; the
  // requested set is server-derived PDP context for findings.summary.read
  // (SPEC-0027).
  repeated string facet_dimensions = 9;
}

// GetFindingsSummaryResponse carries counts and facet values computed under
// the caller's authorization (SPEC-0026 AC6). It deliberately has no field
// capable of expressing an unauthorized total: total_count counts only
// findings the caller may read, and a facet value that exists only in a
// repository the caller may not read is absent, not zero — so the shape
// cannot serve an unfiltered pre-aggregate with a late mask (SPEC-0027 AC4).
message GetFindingsSummaryResponse {
  int64 total_count = 1;
  repeated SummaryFacet facets = 2;
}

// SummaryFacet is one requested dimension's authorized distribution.
message SummaryFacet {
  string dimension = 1;
  repeated SummaryFacetValue values = 2;
}

// SummaryFacetValue is one value within a facet and the count of authorized
// findings carrying it.
message SummaryFacetValue {
  string value = 1;
  int64 count = 2;
}
