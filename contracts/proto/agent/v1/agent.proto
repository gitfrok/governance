syntax = "proto3";

// Agent <-> Control-Plane wire protocol.
// Realizes ADR-0011 (outbound-only agent) and ADR-0017 (gRPC bidi streaming over mTLS).
//
// Transport : a SINGLE long-lived gRPC bidirectional stream, dialed OUTBOUND by the agent.
// AuthN     : mTLS. The agent's identity comes from a client certificate ISSUED BY THE
//             CONTROL PLANE (ADR-0060): a one-time enrolment token bootstraps the first
//             Connect (see Enrol/EnrolmentAck below), the control plane then issues and
//             rotates short-lived client certificates ON this channel, and the certificate
//             names the tenant and the data plane. Nothing the agent asserts in a payload
//             field overrides the certificate's identity (invariant 2 on the agent wire).
// Invariant : source code and secrets NEVER traverse this stream. Only control, telemetry,
//             usage metering, and SIGNED release references. (The enrolment handshake below
//             is the one deliberate exception for credentials: the issued client certificate
//             traverses the channel it authenticates. The token and certificates are never
//             logged, echoed into errors, or used as metric labels — SPEC-0038 AC2.)

package gitsaas.agent.v1;

option go_package = "github.com/yourorg/gitsaas/gen/agent/v1;agentv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------
service AgentGateway {
  // Agent opens this stream outbound and keeps it alive (auto-reconnect + resume via seq).
  rpc Connect(stream AgentMessage) returns (stream ControlPlaneMessage);
}

// ---------------------------------------------------------------------------
// Envelopes
// ---------------------------------------------------------------------------
message AgentMessage {                       // agent -> control plane
  string message_id = 1;                     // ULID; idempotency key
  int64  seq        = 2;                      // monotonic per stream; used for acks/resume
  google.protobuf.Timestamp sent_at = 3;

  oneof payload {
    Register          register          = 10;
    Heartbeat         heartbeat         = 11;
    ActualStateReport actual_state      = 12; // reconciliation loop
    TelemetrySample   telemetry         = 13; // metrics only, no code
    UsageSample       usage             = 14; // fair-use metering (ADR-0008)
    DesiredStateAck   desired_state_ack = 15;
    CommandResult     command_result    = 16;
    Diagnostics       diagnostics       = 17;
    Enrol                  enrol                  = 18; // first Connect only (ADR-0060)
    CertificateRotationAck certificate_rotation_ack = 19;
  }
}

message ControlPlaneMessage {                // control plane -> agent
  string message_id = 1;
  int64  seq        = 2;
  google.protobuf.Timestamp sent_at = 3;
  int64  ack_seq    = 4;                      // highest agent seq CP has durably processed

  oneof payload {
    RegisterAck  register_ack  = 10;
    DesiredState desired_state = 11;          // SIGNED release refs only
    Command      command       = 12;
    ConfigUpdate config        = 13;
    Ping         ping          = 14;
    EnrolmentAck        enrolment_ack      = 15; // answers Enrol (ADR-0060)
    CertificateRotation certificate_rotation = 16;
  }
}

// ---------------------------------------------------------------------------
// Registration
// ---------------------------------------------------------------------------
enum Cloud { CLOUD_UNSPECIFIED = 0; CLOUD_GKE = 1; CLOUD_EKS = 2; CLOUD_AKS = 3; CLOUD_OTHER = 9; }

message Register {
  string cluster_id       = 1;               // informational; identity comes from the control-plane-issued
                                             // client certificate, which names tenant + data plane (ADR-0060)
  Cloud  cloud            = 2;
  string region           = 3;
  string agent_version    = 4;
  string k8s_version      = 5;
  repeated string capabilities = 6;          // e.g. "gvisor","kata","cnpg"
  int64  resume_from_seq  = 7;               // last CP seq the agent durably applied (0 = fresh)
}

message RegisterAck {
  bool   accepted        = 1;
  string reason          = 2;                // set when !accepted
  int64  resume_from_seq = 3;                // where the agent should resume its outbound seq
  google.protobuf.Duration heartbeat_interval = 4;
}

// ---------------------------------------------------------------------------
// Enrolment & certificate rotation  (ADR-0060, SPEC-0038)
// ---------------------------------------------------------------------------
// A one-time enrolment token bootstraps the FIRST Connect of a data plane; the control
// plane answers with a client certificate naming tenant + data plane, and rotates it on
// this channel before expiry. Every later Connect authenticates with the issued
// certificate and uses Register, not Enrol. A data plane holding neither a valid
// certificate nor an unspent token stays disconnected — there is no degraded mode.
// The token and certificates are credentials: they MUST NOT appear in any log line,
// error message, metric label, or file the install writes back (SPEC-0038 AC2).

// Why an enrolment is refused. Deliberately coarse: an invalid token, an unknown token and
// a token of another tenant are indistinguishable to the presenter (SPEC-0038 AC9/SPEC-0001).
enum EnrolmentRefusalReason {
  ENROLMENT_REFUSAL_REASON_UNSPECIFIED   = 0;
  ENROLMENT_REFUSAL_REASON_TOKEN_INVALID = 1; // malformed, unknown, or of another tenant
  ENROLMENT_REFUSAL_REASON_TOKEN_SPENT   = 2; // single-use; includes re-use after a failed first attempt
  ENROLMENT_REFUSAL_REASON_TOKEN_EXPIRED = 3;
  ENROLMENT_REFUSAL_REASON_TOKEN_REVOKED = 4;
  ENROLMENT_REFUSAL_REASON_DENIED        = 5; // control-plane admission decision (e.g. quota)
}

message Enrol {                              // agent -> CP; first Connect ONLY, before any cert exists
  string one_time_token     = 1;             // tenant-scoped, single-use, time-bounded credential
  Cloud  cloud              = 2;
  string region             = 3;
  string agent_version      = 4;
  string k8s_version        = 5;
  repeated string capabilities = 6;          // mirrors Register; feeds the data-plane registry record
}

// A client certificate issued by the control plane. The certificate names the tenant and
// the data plane; nothing the agent asserts in a payload overrides that identity (AC3).
message ClientCertificate {
  string certificate_id      = 1;            // CP-assigned ID; correlation key for rotation acks
  bytes  certificate_pem     = 2;            // PEM chain incl. private key, issued by the control plane
  google.protobuf.Timestamp expires_at = 3;  // rotation MUST complete before this instant (AC4)
}

message EnrolmentAck {                       // CP -> agent; answers Enrol
  bool   accepted        = 1;
  EnrolmentRefusalReason refusal_reason = 2; // set when !accepted
  string detail          = 3;                // coarse prose only; NEVER echoes the token (AC2)
  ClientCertificate issued_certificate = 4;  // set when accepted
  string tenant_id       = 5;                // assigned identity, from the token's tenant scope
  string data_plane_id   = 6;                // assigned identity, minted into the registry record
  google.protobuf.Duration heartbeat_interval = 7;
}

message CertificateRotation {                // CP -> agent; delivered ON the established stream,
  ClientCertificate certificate = 1;         // before the current certificate expires (AC4)
}

// Why the agent could not apply a rotated certificate. Surfaces failures so the control
// plane retries and escalates rather than letting the certificate lapse silently (AC4).
enum CertificateRotationFailureReason {
  CERTIFICATE_ROTATION_FAILURE_REASON_UNSPECIFIED      = 0;
  CERTIFICATE_ROTATION_FAILURE_REASON_UNPARSABLE       = 1; // PEM does not decode / is malformed
  CERTIFICATE_ROTATION_FAILURE_REASON_UNTRUSTED        = 2; // chain does not verify against the pinned CA
  CERTIFICATE_ROTATION_FAILURE_REASON_PERSIST_FAILED   = 3; // could not durably store the credential
  CERTIFICATE_ROTATION_FAILURE_REASON_CLOCK_SKEW       = 4; // validity window inconsistent with local clock
}

message CertificateRotationAck {             // agent -> CP; answers CertificateRotation
  string certificate_id = 1;                 // echoes ClientCertificate.certificate_id
  bool   applied        = 2;
  CertificateRotationFailureReason failure_reason = 3; // set when !applied
  string detail         = 4;                 // coarse prose only; NEVER includes the credential (AC2)
}

// ---------------------------------------------------------------------------
// Health / telemetry  (no source code, no secrets)
// ---------------------------------------------------------------------------
enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;
  HEALTH_STATE_HEALTHY     = 1;
  HEALTH_STATE_DEGRADED    = 2;
  HEALTH_STATE_UNHEALTHY   = 3;
}

message Heartbeat {
  HealthState overall = 1;
  repeated ComponentHealth components = 2;
}

message ComponentHealth {
  string name    = 1;                        // "git-rpc","ci-controller","registry","scanner"
  HealthState state = 2;
  string version = 3;
  string detail  = 4;
}

message TelemetrySample {
  google.protobuf.Timestamp window_start = 1;
  google.protobuf.Timestamp window_end   = 2;
  map<string, double> gauges   = 3;          // e.g. active_runners, repo_count
  map<string, double> counters = 4;          // e.g. builds_started
}

// Fair-use metering for flat-rate cost governance (ADR-0008).
message UsageSample {
  google.protobuf.Timestamp window_start = 1;
  google.protobuf.Timestamp window_end   = 2;
  double ci_minutes    = 3;
  double storage_bytes = 4;
  double egress_bytes  = 5;
  int64  seat_count    = 6;
}

// ---------------------------------------------------------------------------
// Declarative desired-state  (CP owns desired; agent reconciles idempotently)
// ---------------------------------------------------------------------------
message DesiredState {
  int64 generation = 1;                      // monotonic; agent applies newest, ignores older
  repeated Component components = 2;
}

message Component {
  string name   = 1;
  string action = 2;                         // "apply" | "remove"
  SignedRelease release = 3;                 // signed reference ONLY (no inline code/secrets)
  string config_ref = 4;                     // pointer the agent renders locally
}

message SignedRelease {
  string oci_ref   = 1;                      // e.g. registry/gitsaas/git-rpc@sha256:...
  string digest    = 2;                      // sha256 the agent MUST verify
  string signature = 3;                      // cosign/DSSE sig; agent verifies vs pinned key
}

message DesiredStateAck {
  int64  generation = 1;
  bool   applied    = 2;
  string error      = 3;
}

message ActualStateReport {                  // observed reality, drives convergence
  int64 applied_generation = 1;
  repeated ComponentHealth components = 2;
}

// ---------------------------------------------------------------------------
// Commands  (imperative, bounded set)
// ---------------------------------------------------------------------------
enum CommandType {
  COMMAND_TYPE_UNSPECIFIED         = 0;
  COMMAND_TYPE_TRIGGER_RECONCILE   = 1;
  COMMAND_TYPE_ROTATE_CLIENT_CERT  = 2;
  COMMAND_TYPE_DRAIN_RUNNERS       = 3;
  COMMAND_TYPE_COLLECT_DIAGNOSTICS = 4;
}

message Command {
  string command_id = 1;
  CommandType type  = 2;
  map<string, string> args = 3;
}

message CommandResult {
  string command_id = 1;
  bool   ok         = 2;
  string detail     = 3;
}

message ConfigUpdate { map<string, string> values = 1; }
message Diagnostics  { string bundle_ref = 1; string note = 2; } // reference/upload, not code
message Ping         { google.protobuf.Timestamp at = 1; }
