syntax = "proto3";

// Agent <-> Control-Plane wire protocol.
// Realizes ADR-0011 (outbound-only agent) and ADR-0017 (gRPC bidi streaming over mTLS).
//
// Transport : a SINGLE long-lived gRPC bidirectional stream, dialed OUTBOUND by the agent.
// AuthN     : mTLS. The agent's identity comes from a client certificate ISSUED BY THE
//             CONTROL PLANE (ADR-0060): a one-time enrolment token bootstraps the first
//             Connect (see Enrol/EnrolmentAck below), the control plane then issues and
//             rotates short-lived client certificates ON this channel, and the certificate
//             names the tenant and the data plane. Nothing the agent asserts in a payload
//             field overrides the certificate's identity (invariant 2 on the agent wire).
// Invariant : source code and secrets NEVER traverse this stream. Only control, telemetry,
//             usage metering, and SIGNED release references. (The enrolment handshake below
//             is the one deliberate exception for credentials: the issued client certificate
//             traverses the channel it authenticates. The token and certificates are never
//             logged, echoed into errors, or used as metric labels — SPEC-0038 AC2.)

package gitsaas.agent.v1;

option go_package = "github.com/yourorg/gitsaas/gen/agent/v1;agentv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------
service AgentGateway {
  // Agent opens this stream outbound and keeps it alive (auto-reconnect + resume via seq).
  rpc Connect(stream AgentMessage) returns (stream ControlPlaneMessage);
}

// ---------------------------------------------------------------------------
// Envelopes
// ---------------------------------------------------------------------------
message AgentMessage {                       // agent -> control plane
  string message_id = 1;                     // ULID; idempotency key
  int64  seq        = 2;                      // monotonic per stream; used for acks/resume
  google.protobuf.Timestamp sent_at = 3;

  oneof payload {
    Register          register          = 10;
    Heartbeat         heartbeat         = 11;
    ActualStateReport actual_state      = 12; // reconciliation loop
    TelemetrySample   telemetry         = 13; // metrics only, no code
    UsageSample       usage             = 14; // fair-use metering (ADR-0008)
    DesiredStateAck   desired_state_ack = 15;
    CommandResult     command_result    = 16;
    Diagnostics       diagnostics       = 17;
    Enrol                  enrol                  = 18; // first Connect only (ADR-0060)
    CertificateRotationAck certificate_rotation_ack = 19;
    EnvelopeStateAck       envelope_state_ack     = 20; // answers EnvelopeStateUpdate (SPEC-0041 AC9)
  }
}

message ControlPlaneMessage {                // control plane -> agent
  string message_id = 1;
  int64  seq        = 2;
  google.protobuf.Timestamp sent_at = 3;
  int64  ack_seq    = 4;                      // highest agent seq CP has durably processed

  oneof payload {
    RegisterAck  register_ack  = 10;
    DesiredState desired_state = 11;          // SIGNED release refs only
    Command      command       = 12;
    ConfigUpdate config        = 13;
    Ping         ping          = 14;
    EnrolmentAck        enrolment_ack      = 15; // answers Enrol (ADR-0060)
    CertificateRotation certificate_rotation = 16;
    EnvelopeStateUpdate envelope_state     = 17; // fair-use desired state (SPEC-0041 AC9)
  }
}

// ---------------------------------------------------------------------------
// Registration
// ---------------------------------------------------------------------------
enum Cloud { CLOUD_UNSPECIFIED = 0; CLOUD_GKE = 1; CLOUD_EKS = 2; CLOUD_AKS = 3; CLOUD_OTHER = 9; }

message Register {
  string cluster_id       = 1;               // informational; identity comes from the control-plane-issued
                                             // client certificate, which names tenant + data plane (ADR-0060)
  Cloud  cloud            = 2;
  string region           = 3;
  string agent_version    = 4;
  string k8s_version      = 5;
  repeated string capabilities = 6;          // e.g. "gvisor","kata","cnpg"
  int64  resume_from_seq  = 7;               // last CP seq the agent durably applied (0 = fresh)
}

message RegisterAck {
  bool   accepted        = 1;
  string reason          = 2;                // set when !accepted
  int64  resume_from_seq = 3;                // where the agent should resume its outbound seq
  google.protobuf.Duration heartbeat_interval = 4;
}

// ---------------------------------------------------------------------------
// Enrolment & certificate rotation  (ADR-0060, SPEC-0038)
// ---------------------------------------------------------------------------
// A one-time enrolment token bootstraps the FIRST Connect of a data plane; the control
// plane answers with a client certificate naming tenant + data plane, and rotates it on
// this channel before expiry. Every later Connect authenticates with the issued
// certificate and uses Register, not Enrol. A data plane holding neither a valid
// certificate nor an unspent token stays disconnected — there is no degraded mode.
// The token and certificates are credentials: they MUST NOT appear in any log line,
// error message, metric label, or file the install writes back (SPEC-0038 AC2).

// Why an enrolment is refused. Deliberately coarse: an invalid token, an unknown token and
// a token of another tenant are indistinguishable to the presenter (SPEC-0038 AC9/SPEC-0001).
enum EnrolmentRefusalReason {
  ENROLMENT_REFUSAL_REASON_UNSPECIFIED   = 0;
  ENROLMENT_REFUSAL_REASON_TOKEN_INVALID = 1; // malformed, unknown, or of another tenant
  ENROLMENT_REFUSAL_REASON_TOKEN_SPENT   = 2; // single-use; includes re-use after a failed first attempt
  ENROLMENT_REFUSAL_REASON_TOKEN_EXPIRED = 3;
  ENROLMENT_REFUSAL_REASON_TOKEN_REVOKED = 4;
  ENROLMENT_REFUSAL_REASON_DENIED        = 5; // control-plane admission decision (e.g. quota)
}

message Enrol {                              // agent -> CP; first Connect ONLY, before any cert exists
  string one_time_token     = 1;             // tenant-scoped, single-use, time-bounded credential
  Cloud  cloud              = 2;
  string region             = 3;
  string agent_version      = 4;
  string k8s_version        = 5;
  repeated string capabilities = 6;          // mirrors Register; feeds the data-plane registry record
}

// A client certificate issued by the control plane. The certificate names the tenant and
// the data plane; nothing the agent asserts in a payload overrides that identity (AC3).
message ClientCertificate {
  string certificate_id      = 1;            // CP-assigned ID; correlation key for rotation acks
  bytes  certificate_pem     = 2;            // PEM chain incl. private key, issued by the control plane
  google.protobuf.Timestamp expires_at = 3;  // rotation MUST complete before this instant (AC4)
}

message EnrolmentAck {                       // CP -> agent; answers Enrol
  bool   accepted        = 1;
  EnrolmentRefusalReason refusal_reason = 2; // set when !accepted
  string detail          = 3;                // coarse prose only; NEVER echoes the token (AC2)
  ClientCertificate issued_certificate = 4;  // set when accepted
  string tenant_id       = 5;                // assigned identity, from the token's tenant scope
  string data_plane_id   = 6;                // assigned identity, minted into the registry record
  google.protobuf.Duration heartbeat_interval = 7;
}

message CertificateRotation {                // CP -> agent; delivered ON the established stream,
  ClientCertificate certificate = 1;         // before the current certificate expires (AC4)
}

// Why the agent could not apply a rotated certificate. Surfaces failures so the control
// plane retries and escalates rather than letting the certificate lapse silently (AC4).
enum CertificateRotationFailureReason {
  CERTIFICATE_ROTATION_FAILURE_REASON_UNSPECIFIED      = 0;
  CERTIFICATE_ROTATION_FAILURE_REASON_UNPARSABLE       = 1; // PEM does not decode / is malformed
  CERTIFICATE_ROTATION_FAILURE_REASON_UNTRUSTED        = 2; // chain does not verify against the pinned CA
  CERTIFICATE_ROTATION_FAILURE_REASON_PERSIST_FAILED   = 3; // could not durably store the credential
  CERTIFICATE_ROTATION_FAILURE_REASON_CLOCK_SKEW       = 4; // validity window inconsistent with local clock
}

message CertificateRotationAck {             // agent -> CP; answers CertificateRotation
  string certificate_id = 1;                 // echoes ClientCertificate.certificate_id
  bool   applied        = 2;
  CertificateRotationFailureReason failure_reason = 3; // set when !applied
  string detail         = 4;                 // coarse prose only; NEVER includes the credential (AC2)
}

// ---------------------------------------------------------------------------
// Operator enrolment-token issuance door  (SPEC-0038 AC1, T-0030 lineage)
// ---------------------------------------------------------------------------
// The operator-facing door that mints the one-time token Enrol presents on a data
// plane's first Connect. Until this surface existed, IssueEnrolmentToken was reachable
// only from tests: no shipped binary exposed an operator path to mint a token, and the
// north-star journey could not be proven on a cluster. The door mirrors the residency
// Declare door (SPEC-0043, ADR-0063): a separately env-gated admin gRPC surface that
// verifies its caller — a PAT verified before any policy decision — before it serves
// anything. The caller's posture is the PAT-verified platform_operator of ADR-0046:
// tenant and actor are properties of the verified principal on the call, never request
// fields — a field naming them would be an unauthenticated routing claim (ADR-0045).
// The wire vocabulary mirrors the agent module's operator surface (backend/modules/
// agent/api): the lifetime input the domain clamps, and the token record the domain
// returns — its ID, the secret shown exactly once, and the server-set instants.
// The token is a credential: it MUST NOT appear in any log line, error message, metric
// label, or audit record — the audit trail names tokens by ID only (SPEC-0038 AC2).
service EnrolmentService {
  // IssueEnrolmentToken mints one single-use, tenant-scoped, time-bounded enrolment
  // token (SPEC-0038 AC1). The surface is a PEP: it asks the PDP the domain's token
  // issue action and refuses coarsely when refused; unverified and unauthorized are the
  // same coarse refusal (SPEC-0001). Every issuance appends exactly one immutable audit
  // record naming the tenant, the verified actor and the token's ID and expiry — never
  // the secret (AC2, AC7).
  rpc IssueEnrolmentToken(IssueEnrolmentTokenRequest) returns (IssueEnrolmentTokenResponse);
}

// IssueEnrolmentTokenRequest carries the issuance input and NOTHING ELSE. There is
// deliberately no tenant or actor field: the token is minted for the tenant the
// verified caller is scoped to, by the actor the caller verified as — both properties
// of the PAT-verified principal on the call, never wire claims (the residency Declare
// door's subject rule, SPEC-0043 AC6, applied to this door).
message IssueEnrolmentTokenRequest {
  // The requested token lifetime. The domain clamps it: zero, negative or beyond the
  // configured maximum all yield the maximum (backend/modules/agent — the same rule
  // the operator surface applies), so a caller can shorten a token but never lengthen
  // it past the configured bound.
  google.protobuf.Duration lifetime = 1;
}

// IssueEnrolmentTokenResponse is the issued token as the domain records it, plus the
// secret itself, which exists in this response exactly once: the control plane stores
// only its hash, so a caller that fails to capture it mints another token rather than
// retrieving this one (SPEC-0038 AC2). The fields are what an operator needs to store
// the token as a Secret for the data plane's install: the token to present as
// Enrol.one_time_token, its identity, and its validity window.
message IssueEnrolmentTokenResponse {
  string token_id = 1;                       // the token's identity; the only name the audit trail ever uses (AC2)
  string one_time_token = 2;                 // the secret, returned exactly once; single-use, tenant-scoped, time-bounded
  google.protobuf.Timestamp issued_at = 3;   // the server's instant the token was minted
  google.protobuf.Timestamp expires_at = 4;  // the token becomes unusable at this instant (AC1's time bound)
}

// ---------------------------------------------------------------------------
// CA trust bundle distribution  (SPEC-0044 AC2, ADR-0064)
// ---------------------------------------------------------------------------
// The AGENT-IDENTITY trust roots the data plane validates agent certificates against,
// distributed as desired state over the reconcile path (SPEC-0039). Rotation is staged,
// never a cut-over: a new root joins the bundle before issuance moves to it, both roots
// validate during an explicit overlap window, and the outgoing root leaves only after every
// issued certificate chained to it predates its removal (SPEC-0044 AC2 — no fleet
// re-enrolment). The bundle carries more than one trusted root precisely while that overlap
// is open.
//
// This is the CA trust bundle of SPEC-0044 and ADR-0064 — the agent-identity roots. It is a
// DIFFERENT artifact from the RELEASE trust bundle of SPEC-0045 (the cosign release-signing
// keys of ADR-0044/ADR-0065): different owner, different rotation reasons, never one field
// (SPEC-0045's two-bundles note). No name on this surface may imply the release bundle.

// One trusted CA root in the bundle.
message CATrustRoot {
  string root_id         = 1;                // CP-assigned identity for this root; issuance_root_id names one of these
  bytes  certificate_pem = 2;                // PEM certificate of the root, the house form (ClientCertificate.certificate_pem)
  google.protobuf.Timestamp not_after = 3;   // the root's expiry; removal happens only after every certificate
                                             // chained to this root predates its removal (SPEC-0044 AC2)
}

// The staged CA trust bundle. revision advances with every staging step — stage,
// issuance-root move, removal — so consumers detect staging progress and converge on the
// newest revision the way DesiredState.generation converges desired state.
message CATrustBundle {
  int64 revision = 1;                        // monotonic bundle epoch; agents apply the newest
  repeated CATrustRoot trusted_roots = 2;    // every root currently valid; dual-validate overlap ⇒ > 1
  string issuance_root_id = 3;               // root_id of the root NEW certificates chain to; during overlap,
                                             // old-root certificates still VALIDATE but do not issue
}

// ---------------------------------------------------------------------------
// Release trust bundle distribution  (SPEC-0045 AC2, ADR-0044, ADR-0065)
// ---------------------------------------------------------------------------
// The cosign RELEASE-SIGNING keys the data plane verifies signed release references
// (SignedRelease.signature) against, distributed as desired state over the same reconcile
// path (SPEC-0039). Rotation is staged, never a cut-over: a new key joins the bundle before
// releases start signing with it, both keys VERIFY during an explicit overlap window, and
// the outgoing key leaves only after no in-fleet release still signs with it (ADR-0044's
// two-key overlap). The bundle carries more than one trusted key precisely while that
// overlap is open.
//
// This is the RELEASE trust bundle of SPEC-0045 — the cosign release-signing keys of
// ADR-0044/ADR-0065. It is a DIFFERENT artifact from the CA trust bundle above (the
// agent-identity roots of SPEC-0044/ADR-0064): different owner, different rotation reasons,
// never one field or one type (SPEC-0045's two-bundles note).

// One trusted release-signing key in the bundle.
message ReleaseTrustKey {
  string key_id         = 1;                 // CP-assigned identity for this key; signing_key_id names one of these
  bytes  public_key_pem = 2;                 // PEM public key in the cosign key form (ADR-0044); never a private key
}

// The staged release trust bundle. revision advances with every staging step — stage,
// signing-key move, removal — so consumers detect staging progress the way
// DesiredState.generation converges desired state.
message ReleaseTrustBundle {
  int64 revision = 1;                        // monotonic bundle epoch; planes apply the newest
  repeated ReleaseTrustKey trusted_keys = 2; // every key currently valid; dual-validate overlap ⇒ > 1
  string signing_key_id = 3;                 // key_id of the key NEW releases sign with; during overlap,
                                             // old-key signatures still VALIDATE but do not sign
}

// ---------------------------------------------------------------------------
// Health / telemetry  (no source code, no secrets)
// ---------------------------------------------------------------------------
enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;
  HEALTH_STATE_HEALTHY     = 1;
  HEALTH_STATE_DEGRADED    = 2;
  HEALTH_STATE_UNHEALTHY   = 3;
}

message Heartbeat {
  HealthState overall = 1;
  repeated ComponentHealth components = 2;
}

message ComponentHealth {
  string name    = 1;                        // "git-rpc","ci-controller","registry","scanner"
  HealthState state = 2;
  string version = 3;
  string detail  = 4;
}

message TelemetrySample {
  google.protobuf.Timestamp window_start = 1;
  google.protobuf.Timestamp window_end   = 2;
  map<string, double> gauges   = 3;          // e.g. active_runners, repo_count
  map<string, double> counters = 4;          // e.g. builds_started
}

// Fair-use metering for flat-rate cost governance (ADR-0008).
//
// The control plane is the metering authority (ADR-0061): it counts from the
// TelemetrySample events it RECEIVES on this channel. This message is the data
// plane's OWN view of its totals — operational input, never the billing
// number. Where the two diverge, the divergence is a health finding with both
// numbers shown, not an adjustment to the control plane's counters
// (SPEC-0041 AC1).
message UsageSample {
  google.protobuf.Timestamp window_start = 1;
  google.protobuf.Timestamp window_end   = 2;
  double ci_minutes    = 3;
  double storage_bytes = 4;
  double egress_bytes  = 5;
  int64  seat_count    = 6;
  // Additive operational signals (T-0034, SPEC-0041): sizes and peaks the
  // control plane cannot yet derive from received telemetry events. Reporting
  // them never changes a control-plane counter (ADR-0061 §2).
  double ci_concurrency_peak = 7;            // peak concurrent CI jobs in the window
  double scan_bytes          = 8;            // bytes scanned in the window
  int64  repository_count    = 9;            // repositories hosted at window end
  double index_bytes         = 10;           // code-search index size at window end
}

// ---------------------------------------------------------------------------
// Fair-use envelopes  (SPEC-0041, ADR-0061: throttle and notify, never git)
// ---------------------------------------------------------------------------
// The PRD §6 fair-use dimensions. Coverage is explicit per phase (SPEC-0041
// AC2): a dimension the control plane cannot derive from received telemetry is
// DEFERRED and renders as "not metered" — never as zero or within-envelope.
enum FairUseDimension {
  FAIR_USE_DIMENSION_UNSPECIFIED        = 0;
  FAIR_USE_DIMENSION_SEATS              = 1;
  FAIR_USE_DIMENSION_REPOSITORY_COUNT   = 2;
  FAIR_USE_DIMENSION_REPOSITORY_STORAGE = 3;
  FAIR_USE_DIMENSION_CI_MINUTES         = 4;
  FAIR_USE_DIMENSION_CI_CONCURRENCY     = 5;
  FAIR_USE_DIMENSION_SCAN_VOLUME        = 6;
  FAIR_USE_DIMENSION_INDEX_SIZE         = 7;
  FAIR_USE_DIMENSION_EGRESS             = 8;
}

// The envelope condition of one dimension, computed in the control plane.
// NEAR is the notification threshold BEFORE breach (SPEC-0041 AC4); EXCEEDED
// throttles and notifies, and git push, fetch, clone and all reads stay fully
// available in every state (SPEC-0041 AC7, ADR-0061 §4).
enum EnvelopeState {
  ENVELOPE_STATE_UNSPECIFIED = 0;
  ENVELOPE_STATE_WITHIN      = 1;
  ENVELOPE_STATE_NEAR        = 2;            // notification threshold reached, pre-breach
  ENVELOPE_STATE_EXCEEDED    = 3;
}

// One dimension's envelope condition with the counters the decision was made
// from: the customer and the control plane read the same numbers (SPEC-0041
// AC10), and the interval is recorded, not inferred (G6 evidence).
message DimensionEnvelope {
  FairUseDimension dimension      = 1;
  EnvelopeState    state          = 2;
  double current_value            = 3;       // the control plane's authoritative counter
  double envelope_value           = 4;       // per-tenant configuration, never compiled in
  double notification_value       = 5;       // the AC4 threshold, below envelope_value
  string unit                     = 6;       // coarse unit prose, e.g. "minutes", "bytes"
  google.protobuf.Timestamp window_start = 7; // the interval the counter was derived from
  google.protobuf.Timestamp window_end   = 8;
  string message                  = 9;       // coarse prose; never carries a secret
}

// Envelope state reaches the data plane as DESIRED STATE on this channel; the
// control plane never reaches into the cluster to enforce it (SPEC-0041 AC9).
// Enforcement is throttle-and-notify only: reduced CI concurrency and a queue
// depth cap whose delays are visible on the job (AC5). No field here can make
// a repository read-only or block a git operation (AC7, AC8).
message EnvelopeStateUpdate {                // CP -> agent
  int64 generation = 1;                      // monotonic; the agent applies the newest
  repeated DimensionEnvelope dimensions = 2;
  int32 max_ci_concurrency = 3;              // set on a CI-dimension breach; 0 = unchanged
  int64 queue_depth_cap    = 4;              // queued jobs are delayed, never dropped (AC5)
}

message EnvelopeStateAck {                   // agent -> CP; answers EnvelopeStateUpdate
  int64  generation = 1;                     // echoes EnvelopeStateUpdate.generation
  bool   applied    = 2;
  string error      = 3;                     // coarse prose only
}

// ---------------------------------------------------------------------------
// Declarative desired-state  (CP owns desired; agent reconciles idempotently)
// ---------------------------------------------------------------------------
message DesiredState {
  int64 generation = 1;                      // monotonic; agent applies newest, ignores older
  repeated Component components = 2;
  // The staged CA trust bundle (SPEC-0044 AC2, ADR-0064): the agent-identity trust roots the
  // data plane validates agent certificates against. Additive — an absent field means no
  // bundle update and the agent keeps its current roots. This is NOT the release trust
  // bundle of SPEC-0045 (cosign release-signing keys): a different artifact that rides its
  // own field, release_trust_bundle, with its own type, named apart from this one.
  CATrustBundle ca_trust_bundle = 3;
  // The staged RELEASE trust bundle (SPEC-0045 AC2, ADR-0044/ADR-0065): the cosign
  // release-signing keys the data plane verifies SignedRelease references against. Additive —
  // an absent field means no bundle update and the plane keeps its current keys. This is NOT
  // the CA trust bundle of SPEC-0044 (agent-identity roots): a different artifact with its
  // own field, type and rotation reasons (SPEC-0045's two-bundles note).
  ReleaseTrustBundle release_trust_bundle = 4;
}

message Component {
  string name   = 1;
  string action = 2;                         // "apply" | "remove"
  SignedRelease release = 3;                 // signed reference ONLY (no inline code/secrets)
  string config_ref = 4;                     // pointer the agent renders locally
}

message SignedRelease {
  string oci_ref   = 1;                      // e.g. registry/gitsaas/git-rpc@sha256:...
  string digest    = 2;                      // sha256 the agent MUST verify
  string signature = 3;                      // cosign/DSSE sig; agent verifies vs pinned key
}

// The payload kind a DesiredStateAck answers. The reconcile channel delivers
// SEVERAL desired-state artifacts whose generations are INDEPENDENT revision
// spaces (the CA trust bundle revision of SPEC-0044 and the release trust
// bundle revision of SPEC-0045 both start at 1), so an ack must say WHICH
// artifact it acknowledges: without a discriminator, a control plane cannot
// attribute an ack's generation to the right registry, and a forward-only
// GREATEST upsert would make the misattribution uncorrectable (SPEC-0045's
// two-bundles note, extended to the ack path). UNSPECIFIED means a plane
// predating this field: its ack is attributed to NO registry, which is safe
// — attribution never widens on ambiguity.
enum DesiredStateKind {
  DESIRED_STATE_KIND_UNSPECIFIED           = 0;
  DESIRED_STATE_KIND_CA_TRUST_BUNDLE       = 1;
  DESIRED_STATE_KIND_RELEASE_TRUST_BUNDLE  = 2;
}

message DesiredStateAck {
  int64  generation = 1;
  bool   applied    = 2;
  string error      = 3;
  // The artifact this ack answers (see DesiredStateKind). Additive — a plane
  // that does not set it sends UNSPECIFIED and its ack is attributed to no
  // registry.
  DesiredStateKind kind = 4;
}

message ActualStateReport {                  // observed reality, drives convergence
  int64 applied_generation = 1;
  repeated ComponentHealth components = 2;
  // Rollout observability (SPEC-0039 AC6): the phase of the rollout that produced
  // applied_generation. A data plane that has not reported since a rollout began sends no
  // report at all — the control plane marks it stale, never "upgraded".
  RolloutPhase rollout_phase = 3;
  // Coarse prose for the phase, set on FAILED and ROLLED_BACK to carry the reason (AC5).
  // Never carries a secret or a credential; never echoes a signing key.
  string rollout_message = 4;
}

// The lifecycle of one reconcile-based rollout as the agent reports it (SPEC-0039 AC5/AC6).
// Deliberately coarse: the control plane distinguishes a healthy convergence from a failure
// that rolled back, and nothing finer is needed on the wire.
enum RolloutPhase {
  ROLLOUT_PHASE_UNSPECIFIED = 0;             // no rollout in flight for applied_generation
  ROLLOUT_PHASE_IN_PROGRESS = 1;             // desired state being reconciled toward
  ROLLOUT_PHASE_APPLIED     = 2;             // desired state converged and verified healthy
  ROLLOUT_PHASE_FAILED      = 3;             // convergence failed; rollout_message says why
  ROLLOUT_PHASE_ROLLED_BACK = 4;             // failed upgrade reverted to the prior release
}

// ---------------------------------------------------------------------------
// Commands  (imperative, bounded set)
// ---------------------------------------------------------------------------
enum CommandType {
  COMMAND_TYPE_UNSPECIFIED         = 0;
  COMMAND_TYPE_TRIGGER_RECONCILE   = 1;
  COMMAND_TYPE_ROTATE_CLIENT_CERT  = 2;
  COMMAND_TYPE_DRAIN_RUNNERS       = 3;
  COMMAND_TYPE_COLLECT_DIAGNOSTICS = 4;
}

message Command {
  string command_id = 1;
  CommandType type  = 2;
  map<string, string> args = 3;
}

message CommandResult {
  string command_id = 1;
  bool   ok         = 2;
  string detail     = 3;
}

message ConfigUpdate { map<string, string> values = 1; }
message Diagnostics  { string bundle_ref = 1; string note = 2; } // reference/upload, not code
message Ping         { google.protobuf.Timestamp at = 1; }

// ---------------------------------------------------------------------------
// Fleet visibility for an org administrator  (SPEC-0058 AC1, PR-31, ADR-0077)
// ---------------------------------------------------------------------------
// FleetReader serves the admin area's fleet report: which data planes a tenant
// has, what each last said, and WHEN it last said it.
//
// It is a new service rather than an RPC on EnrolmentService because the callers
// differ in kind. EnrolmentService is an operator door authenticated by a PAT,
// and deliberately carries no tenant or actor field — both are properties of the
// verified principal on the call. This read is made by an org administrator
// through the BFF under a session, so it carries a context the way usage/v1
// does. One service with two authentication stories is how a door ends up
// trusting the wrong one.
//
// WHAT IS ABSENT HERE IS ADR-0077 DECISION 1. There is no audit-trail read on
// this service and none anywhere in this package: the audit log is reached
// through a scoped, time-boxed, revocable grant (SPEC-0033), never through a
// role, and an unbounded trail browser behind an "administrator" would make that
// grant machinery decorative. check-contracts' check 17 asserts the absence
// against the compiled descriptor.
//
// There is also no per-person field. `Last active` on a member is presence
// telemetry about people, nothing else in this product collects any, and this is
// not the surface that starts.
service FleetReader {
  // ListFleet returns one tenant's data planes and its provisioned-but-never-
  // connected rows. It is an `agent.dataplane.read` decision — the action the
  // Agent context already asks, granted to `owner` and to nobody else. This
  // surface adds no action and no role (ADR-0077 decision 2).
  rpc ListFleet(ListFleetRequest) returns (ListFleetResponse);
}

// FleetContext carries the verified caller. Roles are verified principal
// attributes supplied to the PDP input, never a caller-provided authorization
// result — the same shape UsageContext has.
message FleetContext {
  string tenant_id = 1;
  string actor_id = 2;
  repeated string actor_roles = 3;
  string request_id = 4;
}

// DataPlaneReport is what the control plane last heard from one data plane.
//
// last_seen_at is the field this message exists for. The data plane's connection
// is outbound-only (ADR-0011), so nothing here is live truth: it is a report
// with an age, and a consumer that renders the status without the instant
// misrepresents the architecture as a console (ADR-0077 decision 3).
//
// status is the vocabulary the Agent context derives, as a string for the reason
// the audit action vocabulary is one: a new state is additive rather than a
// coordinated deploy. STALE is never rendered as healthy (SPEC-0038 AC8).
message DataPlaneReport {
  string data_plane_id = 1;
  string status = 2;
  string cloud = 3;
  string region = 4;
  string agent_version = 5;
  string k8s_version = 6;
  // The instant the control plane last heard from this plane. Empty for a row
  // that has never connected.
  string last_seen_at = 7;
  string enrolled_at = 8;
  string certificate_expires_at = 9;
  // Set for a provisioned-but-never-connected row: an enrolment token that has
  // not been spent. A row like this is a data plane somebody meant to have, and
  // omitting it would report a smaller fleet than the tenant provisioned.
  string token_id = 10;
}

message ListFleetRequest { FleetContext context = 1; }

// The response carries no total and no count of anything the caller may not see,
// the same property every other list in this product has. It carries no audit
// record and no person.
message ListFleetResponse { repeated DataPlaneReport planes = 1; }
