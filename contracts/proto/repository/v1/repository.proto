syntax = "proto3";
package gitsaas.repository.v1;
option go_package = "github.com/yourorg/gitsaas/gen/proto/repository/v1;repositoryv1";

// Internal Repository/Git read surface (SPEC-0017). Authorization stays server-side.
service RepositoryReader {
  rpc GetTree(GetTreeRequest) returns (GetTreeResponse);
  rpc GetFile(GetFileRequest) returns (stream FileChunk);
  rpc GetDiff(GetDiffRequest) returns (stream DiffChunk);
  // GetMergeBase computes the merge base of two refs or commits. Additive for
  // SPEC-0028: introduction attribution is the set difference between the
  // scan at an MR's head revision and the scan at the merge base of its
  // target branch, and nothing on this surface computed a merge base before.
  // Authorization stays server-side exactly as for the other reads.
  rpc GetMergeBase(GetMergeBaseRequest) returns (GetMergeBaseResponse);
}

// RepositoryRegistry answers which repositories exist for a caller (SPEC-0052,
// PR-24). Additive, and deliberately a SECOND service rather than another RPC
// on RepositoryReader.
//
// They are served by different processes, and that is the whole reason.
// RepositoryReader is git-storaged: it reads bare repositories from block
// volumes and holds no record of which repositories the product knows about.
// The registry is the Repository context in the data plane, and per ADR-0071
// it — not the disk — is the product's truth for existence. Putting the list
// on RepositoryReader would have asked the process that cannot answer.
service RepositoryRegistry {
  // ListRepositories answers which repositories the caller may see.
  //
  // The listable set is derived server-side from the caller's authorization at
  // request time. There is deliberately no repository set, filter, owner or
  // visibility field: a caller cannot widen what it is shown, because there is
  // nothing to widen it with (ADR-0071 decision 4, as SPEC-0035 AC2 does for
  // a search query).
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);
}
// Roles are verified principal attributes supplied to the Repository/Git PDP
// input. They are not a caller-provided authorization result.
message ReadContext {
  string tenant_id = 1;
  string repository_id = 2;
  string actor_id = 3;
  string request_id = 4;
  repeated string actor_roles = 5;
}
// ListContext is a ReadContext without a repository: the caller is verified,
// and there is no repository to name because the answer is which ones exist.
// Reusing ReadContext would have left a repository_id the caller could
// populate to mean something the server must then ignore, and a field that
// must be ignored is worse than no field — someone eventually stops ignoring
// it.
message ListContext {
  string tenant_id = 1;
  string actor_id = 2;
  string request_id = 3;
  repeated string actor_roles = 4;
}
message ListRepositoriesRequest { ListContext context = 1; string page_token = 2; int32 page_size = 3; }
// The response carries no total, and that absence is load-bearing: no field
// here is capable of expressing how many repositories the caller may NOT see,
// so non-enumeration is a property of the contract rather than a discipline
// each consumer has to remember (SPEC-0052 AC5, as SPEC-0035 AC3 does for
// search).
message ListRepositoriesResponse { repeated RepositorySummary repositories = 1; string next_page_token = 2; }
message RepositorySummary { string repository_id = 1; string name = 2; }

message GetTreeRequest { ReadContext context = 1; string revision = 2; string page_token = 3; int32 page_size = 4; }
message GetTreeResponse { repeated TreeEntry entries = 1; string next_page_token = 2; }
message TreeEntry { string path = 1; EntryKind kind = 2; string object_id = 3; uint32 mode = 4; int64 size_bytes = 5; }
enum EntryKind { ENTRY_KIND_UNSPECIFIED = 0; ENTRY_KIND_FILE = 1; ENTRY_KIND_DIRECTORY = 2; ENTRY_KIND_SYMLINK = 3; }
message GetFileRequest { ReadContext context = 1; string revision = 2; string path = 3; }
message FileChunk { FileMetadata metadata = 1; bytes data = 2; bool eof = 3; }
message FileMetadata { string path = 1; string object_id = 2; uint32 mode = 3; int64 size_bytes = 4; }
message GetDiffRequest { ReadContext context = 1; string base_revision = 2; string head_revision = 3; string path = 4; }
message DiffChunk { bytes data = 1; bool eof = 2; }
// GetMergeBaseRequest names the two sides of the comparison as refs or
// commit identifiers — a merge request's source ref and target ref are the
// SPEC-0028 shape. An empty side is rejected; resolution is server-side.
message GetMergeBaseRequest { ReadContext context = 1; string ref_a = 2; string ref_b = 3; }
// GetMergeBaseResponse names the merge base. A pair with no common ancestor
// (unrelated histories) is not an error: found is false and merge_base stays
// empty, so the caller — Security/Findings, per SPEC-0028 — reports
// attribution UNAVAILABLE rather than attributing everything.
message GetMergeBaseResponse { bool found = 1; string merge_base = 2; }
