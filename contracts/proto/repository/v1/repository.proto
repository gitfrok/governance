syntax = "proto3";
package gitsaas.repository.v1;
option go_package = "github.com/yourorg/gitsaas/gen/proto/repository/v1;repositoryv1";

// Internal Repository/Git read surface (SPEC-0017). Authorization stays server-side.
service RepositoryReader {
  rpc GetTree(GetTreeRequest) returns (GetTreeResponse);
  rpc GetFile(GetFileRequest) returns (stream FileChunk);
  rpc GetDiff(GetDiffRequest) returns (stream DiffChunk);
}
message ReadContext { string tenant_id = 1; string repository_id = 2; string actor_id = 3; string request_id = 4; }
message GetTreeRequest { ReadContext context = 1; string revision = 2; string page_token = 3; int32 page_size = 4; }
message GetTreeResponse { repeated TreeEntry entries = 1; string next_page_token = 2; }
message TreeEntry { string path = 1; EntryKind kind = 2; string object_id = 3; uint32 mode = 4; int64 size_bytes = 5; }
enum EntryKind { ENTRY_KIND_UNSPECIFIED = 0; ENTRY_KIND_FILE = 1; ENTRY_KIND_DIRECTORY = 2; ENTRY_KIND_SYMLINK = 3; }
message GetFileRequest { ReadContext context = 1; string revision = 2; string path = 3; }
message FileChunk { FileMetadata metadata = 1; bytes data = 2; bool eof = 3; }
message FileMetadata { string path = 1; string object_id = 2; uint32 mode = 3; int64 size_bytes = 4; }
message GetDiffRequest { ReadContext context = 1; string base_revision = 2; string head_revision = 3; string path = 4; }
message DiffChunk { bytes data = 1; bool eof = 2; }
