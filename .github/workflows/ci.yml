# Governance CI (T-0009). Until now this repo had no gate at all and relied on review, which is
# the wrong way round: every other repo defers its decisions to this one (invariant 21), so a
# broken link or an unindexed ADR here is a decision an agent will not find.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # The job name is the required-status-check context registered in this repo's `main-integrity`
    # ruleset (super-repo `scripts/apply-rulesets.sh`), so it stays `docs gates` even though the job
    # now also gates contracts/. Renaming it would silently un-require the whole job until the
    # super-repo caught up — the drift ADR-0031 exists to prevent. The contract gate is required
    # from the moment this merges precisely because it rides inside an already-required context.
    name: docs gates
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so `buf breaking` has a baseline. With the default depth of 1 there is no
      # origin/main to compare against, and the check would have to be skipped — a skipped gate on
      # the shared surface is how the contract-schema row in ci-gates.md went years without one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned like buf below and OPA further down, and for the same reason: an unpinned linter is a
      # gate whose verdict depends on the day. This was unpinned until now, and in the super-repo the
      # equivalent gap produced a red run during T-0005 — a finding the runner's preinstalled 0.9.0
      # reports and a newer local 0.11.0 does not. Which of the two is right matters less than the two
      # agreeing: a gate a developer cannot reproduce locally is one they learn to push and see.
      #
      # Installed into a user-writable directory, so the step needs no sudo and shadows the runner's
      # copy by PATH order alone.
      - name: pin shellcheck to v0.11.0
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - --strip-components=1 -C "$HOME/.local/bin" "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/shellcheck" --version

      # The scripts are the gate; lint them before trusting them.
      - name: shellcheck
        run: shellcheck scripts/*.sh

      # Relative links resolve, ADRs/specs/tasks/plans are all indexed, ADR numbers are unique.
      - name: docs gates
        run: ./scripts/check-docs.sh

      # ADR-0037: the agent-facing surfaces are generated from canonical/agent-surfaces/, so a
      # hand-edit to AGENTS.md, CLAUDE.md or opencode.json is drift. Only this repo's three surfaces
      # are checkable here — the other four repos are submodules a standalone run does not have, the
      # same composition boundary the super-repo's check-codegen-fresh.sh documents. Riding inside
      # the already-required `docs gates` context means it is required from the moment it merges.
      - name: agent surface freshness
        run: ./scripts/check-agent-surfaces-fresh.sh

      # SPEC-0012: the ceremony tier a PR declares must match what its diff does. The tier is read
      # from the PR body, so this only has something to assert on a pull_request event — on a push
      # to main there is no declaration and the gate is not the right place to invent one.
      # fetch-depth: 0 above is what makes the diff resolvable; without it this exits 3 rather than
      # passing quietly.
      - name: ceremony tier
        if: github.event_name == 'pull_request'
        run: ./scripts/check-ceremony-tier.sh
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          CEREMONY_BASE: origin/${{ github.base_ref }}

      # The gate is only worth having if it behaves; SPEC-0012's acceptance criteria are its tests.
      - name: ceremony tier tests
        run: ./scripts/test-ceremony-tier.sh

      # SPEC-0013: the scope hook is only worth installing if it behaves. Same shape as the ceremony
      # tests — a throwaway repo per case, driven through `git commit` rather than by calling the
      # script directly, so the hook's real invocation path is what gets exercised.
      - name: dispatch scope tests
        run: ./scripts/test-dispatch-scope.sh

      # SPEC-0013 open question 1: the pre-commit hook is skipped by --no-verify, so the boundary
      # only binds if CI checks the pushed diff too. Invariant 23 is asserted here unconditionally —
      # the ceremony gate only reaches its span check under the `bugfix` tier, which left a
      # `full`-tier PR spanning two submodules unchecked.
      - name: dispatch scope
        if: github.event_name == 'pull_request'
        run: ./scripts/check-dispatch-scope.sh
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          SCOPE_BASE: origin/${{ github.base_ref }}

      - name: dispatch scope CI tests
        run: ./scripts/test-dispatch-scope-ci.sh

      # SPEC-0014 AC8: the flag audit binds on Linux too, so a contributor with no Mac finds a GNU-only
      # construct here rather than on the macOS lane. Part 3 — the userland assertion — does not apply
      # on this OS and the gate says so on its own output line rather than passing silently.
      - name: shell portability audit
        run: ./scripts/check-shell-portability.sh

      - name: shell portability tests
        run: ./scripts/test-shell-portability.sh

      # T-0020 / ADR-0032: contracts/ is the only shared surface, and every consumer generates from
      # it. Pinned rather than floating — a linter that changes its mind between runs is a gate
      # whose verdict depends on the day.
      #
      # Installed directly rather than via bufbuild/buf-setup-action: that action is the one here
      # with no node24 release to move to — its v1 line ends at v1.50.0 and every tag in it is still
      # node20 — so the runner deprecation cannot be cleared by a version bump the way checkout's
      # was. The pin is the part that matters, and a pinned download holds it without depending on
      # an action's release cadence. Same shape as the shellcheck step above, for the same reason.
      - name: pin buf to v1.72.0
        env:
          BUF_VERSION: v1.72.0
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/bufbuild/buf/releases/download/${BUF_VERSION}/buf-Linux-x86_64" \
            -o "$HOME/.local/bin/buf"
          chmod +x "$HOME/.local/bin/buf"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/buf" --version

      # The baseline is passed explicitly rather than left to the script's local-use fallback, so CI
      # can never end up comparing the branch against itself.
      - name: contract schema gates
        run: ./scripts/check-contracts.sh
        env:
          CONTRACTS_BASELINE: .git#branch=origin/main,subdir=contracts

      # T-0005 / ADR-0006: policies/ is the whole of the system's authorization logic (invariant 2),
      # so it is gated here for the same reason contracts/ is — every consumer defers to it and a
      # defect propagates before review can catch it. ci-gates.md has marked the Rego row required
      # in this repo since it was written; until now there was no check and nothing to run it on.
      # Pinned like buf, and for the same reason: a policy engine that changes its evaluation
      # between runs is a gate whose verdict depends on the day.
      #
      # `@v2.4.0` and not `@v2`: this action publishes no moving major-version tag (unlike
      # actions/checkout above), so `@v2` resolves to nothing and the step would fail at load time
      # rather than run unpinned. It is left at v2.4.0 by the node24 sweep because it already
      # declares node24 — it was never one of the actions the deprecation warning named.
      - uses: open-policy-agent/setup-opa@v2.4.0
        with:
          version: 1.19.0

      - name: policy gates
        run: ./scripts/check-policies.sh

  # SPEC-0014, T-0003 AC4. The macOS half of "works on macOS and Linux" had never run on macOS; what
  # stood in for it was a bash:3.2 container that is Alpine plus busybox, with no lineage to Darwin.
  # This is the real thing, and it is free because the repo is public.
  #
  # A SEPARATE JOB, WHICH MEANS A SEPARATE REQUIRED-CHECK CONTEXT. The `docs gates` name above is
  # registered in this repo's `main-integrity` ruleset; this job's name is registered alongside it by
  # the super-repo's scripts/apply-rulesets.sh. Until `make rulesets-apply` runs, this lane reports
  # but does not block — the gap is named here rather than discovered later.
  portability:
    name: macOS portability
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # Part 3 of the gate asserts the bash and the userland before anything else runs, so a runner
      # image that put Homebrew's GNU coreutils ahead of /usr/bin fails here loudly instead of
      # quietly turning this lane into a second Linux one.
      - name: shell portability gate
        run: ./scripts/check-shell-portability.sh

      # Parsing proves no bash-4 syntax; running proves no bash-4 behaviour and no GNU userland
      # dependency. The two defects the 2026-08 audit found were both invisible to parsing — one
      # aborted this repo's docs gate outright, the other failed silently inside a `|| echo unknown`.
      - name: docs gates on BSD
        run: ./scripts/check-docs.sh

      - name: agent surface freshness on BSD
        run: ./scripts/check-agent-surfaces-fresh.sh

      - name: ceremony tier tests on BSD
        run: ./scripts/test-ceremony-tier.sh

      - name: dispatch scope tests on BSD
        run: ./scripts/test-dispatch-scope.sh

      - name: dispatch scope CI tests on BSD
        run: ./scripts/test-dispatch-scope-ci.sh

      # The positive control for part 3 that Linux cannot supply: on this runner the userland really
      # is BSD, so the assertion has to pass rather than being stubbed into passing.
      - name: shell portability tests on BSD
        run: ./scripts/test-shell-portability.sh
