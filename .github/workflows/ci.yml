# Governance CI (T-0009). Until now this repo had no gate at all and relied on review, which is
# the wrong way round: every other repo defers its decisions to this one (invariant 21), so a
# broken link or an unindexed ADR here is a decision an agent will not find.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # The job name is the required-status-check context registered in this repo's `main-integrity`
    # ruleset (super-repo `scripts/apply-rulesets.sh`), so it stays `docs gates` even though the job
    # now also gates contracts/. Renaming it would silently un-require the whole job until the
    # super-repo caught up — the drift ADR-0031 exists to prevent. The contract gate is required
    # from the moment this merges precisely because it rides inside an already-required context.
    name: docs gates
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so `buf breaking` has a baseline. With the default depth of 1 there is no
      # origin/main to compare against, and the check would have to be skipped — a skipped gate on
      # the shared surface is how the contract-schema row in ci-gates.md went years without one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The scripts are the gate; lint them before trusting them.
      - name: shellcheck
        run: shellcheck scripts/*.sh

      # Relative links resolve, ADRs/specs/tasks/plans are all indexed, ADR numbers are unique.
      - name: docs gates
        run: ./scripts/check-docs.sh

      # T-0020 / ADR-0032: contracts/ is the only shared surface, and every consumer generates from
      # it. Pinned rather than floating — a linter that changes its mind between runs is a gate
      # whose verdict depends on the day.
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
          github_token: ${{ github.token }}

      # The baseline is passed explicitly rather than left to the script's local-use fallback, so CI
      # can never end up comparing the branch against itself.
      - name: contract schema gates
        run: ./scripts/check-contracts.sh
        env:
          CONTRACTS_BASELINE: .git#branch=origin/main,subdir=contracts

      # T-0005 / ADR-0006: policies/ is the whole of the system's authorization logic (invariant 2),
      # so it is gated here for the same reason contracts/ is — every consumer defers to it and a
      # defect propagates before review can catch it. ci-gates.md has marked the Rego row required
      # in this repo since it was written; until now there was no check and nothing to run it on.
      # Pinned like buf, and for the same reason: a policy engine that changes its evaluation
      # between runs is a gate whose verdict depends on the day.
      #
      # `@v2.4.0` and not `@v2`: this action publishes no moving major-version tag (unlike
      # actions/checkout and buf-setup-action above), so `@v2` resolves to nothing and the step
      # would fail at load time rather than run unpinned.
      - uses: open-policy-agent/setup-opa@v2.4.0
        with:
          version: 1.19.0

      - name: policy gates
        run: ./scripts/check-policies.sh
